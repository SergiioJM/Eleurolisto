<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../../toolkit/mascota/listo2d.js"></script>
<script>
// R6 · Pixel art con diálogo de RPG — "¿Cuánto efectivo puedes guardar en casa?" (El Euro Listo, 19-nov 13:30)
// Mundo a 216x384 px escalado x5 sin suavizado. Side-scroller: CASA → PAPELES → TIENDA → BANCO → HACIENDA → menú.
// Sin cambios de luz: pared fija, nada de flashes; todo el dinamismo es movimiento.
const TIM = window.TIM, S = TIM.segments;
const st = (i) => S[i].start, en = (i) => S[i].start + S[i].dur;
const pal = (i, f) => (S[i].words.find((w) => w.w.toLowerCase().includes(f)) || S[i].words[0]).start;
const DUR = (window.DURACION = +(TIM.total + 0.2).toFixed(2));
const P = 5, VW = 216, VH = 384, WW = 1100;
const C = document.getElementById("c"), X = C.getContext("2d");
const F = document.createElement("canvas"); F.width = VW; F.height = VH; const f = F.getContext("2d");
const BG = document.createElement("canvas"); BG.width = WW; BG.height = VH; const b = BG.getContext("2d");
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const lerp = (a, c, k) => a + (c - a) * k;
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const eio = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eb = (x, s = 1.8) => { x = clamp(x); const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const bounce = (x) => { x = clamp(x); const n = 7.5625, d = 2.75;
  if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75;
  if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375; return n * (x -= 2.625 / d) * x + 0.984375; };
const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

// ---------- tiempos (todo atado a la voz) ----------
const tPeek = pal(0, "efectivo") - 0.05, tFlut = pal(0, "guardar") - 0.1, tSafe = pal(0, "casa") - 0.05;
const tRain = st(1) - 0.05, tLim = pal(1, "límite"), tLegal = pal(1, "legal");
const tPan1 = st(2) - 0.3, tPiensa = pal(2, "tienes"), tNom = pal(2, "demostrar"), tFac = pal(2, "dónde"), tCheck = pal(2, "sale");
const tPan2 = st(3) - 0.32, tEmp = pal(3, "empresa"), tAut = pal(3, "autónomo"), t999 = pal(3, "siempre"), tMil = pal(3, "mil"), tBack = pal(3, "efectivo");
const tPan3 = st(4) - 0.32, tIng = pal(4, "ingresas"), tSac = pal(4, "sacas"), tTres = pal(4, "tres"), tBan = pal(4, "banco"), tCom = pal(4, "comunica"), tHac = pal(4, "hacienda");
const tCTA = st(5) - 0.15, tGuar = pal(5, "guárdalo"), tListo = pal(5, "listo");
const hits = [tMil + 0.3, tTres];

// cámara (x del mundo, siempre entera)
function camX(t) {
  let x = 0;
  x = lerp(x, 216, eio(prog(t, tPan1, 0.6)));
  x = lerp(x, 432, eio(prog(t, tPan2, 0.6)));
  x = lerp(x, 648, eio(prog(t, tPan3, 0.6)));
  x = lerp(x, 792, eio(prog(t, tCom - 0.05, 0.65)));
  return Math.round(x);
}
function shake(t) { for (const h of hits) { const k = Math.floor((t - h) * 30); if (k >= 0 && k < 4) return [1, -1, 1, 0][k]; } return 0; }

// ---------- texto de píxeles en el mundo (alfa cuantizado: bordes duros) ----------
const TT = document.createElement("canvas"); TT.width = 600; TT.height = 60; const tt = TT.getContext("2d", { willReadFrequently: true });
const ACUTE = { "Á": "A", "É": "E", "Í": "I", "Ó": "O", "Ú": "U" };
// Press Start 2P encoge las mayúsculas con tilde: se dibuja la letra normal y la tilde a mano (2 bloques encima)
function psDraw(c, s, x, y, size, col) {
  const u = size / 8; c.font = `${size}px PS2P`; c.textBaseline = "top"; c.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i], base = ACUTE[ch], cx = x + i * size;
    if (base) { c.fillText(base, cx, y); c.fillRect(cx + 4 * u, y - 3 * u, u, u); c.fillRect(cx + 3 * u, y - 2 * u, u, u); }
    else c.fillText(ch, cx, y);
  }
  return s.length * size;
}
function ptext(c, s, x, y, col, o = {}) {
  const size = o.size || 8, font = o.font || "PS2P", align = o.align || "left";
  tt.clearRect(0, 0, TT.width, TT.height); tt.font = `${size}px ${font}`; tt.textBaseline = "top"; tt.fillStyle = col;
  const pad = font === "PS2P" ? Math.ceil(size * 3 / 8) : 0;
  const w = font === "PS2P" ? psDraw(tt, s, 1, 1 + pad, size, col) : (tt.fillText(s, 1, 1 + pad), Math.ceil(tt.measureText(s).width));
  y -= pad;
  const hh = size + 4 + pad;
  const im = tt.getImageData(0, 0, w + 2, hh);
  for (let i = 3; i < im.data.length; i += 4) im.data[i] = im.data[i] > 110 ? 255 : 0;
  tt.putImageData(im, 0, 0);
  const xx = align === "center" ? x - Math.round(w / 2) : align === "right" ? x - w : x;
  c.drawImage(TT, 0, 0, w + 2, hh, Math.round(xx) - 1, Math.round(y) - 1, w + 2, hh);
  return w;
}
function ptextS(c, s, x, y, col, sh, o = {}) { ptext(c, s, x + 1, y + 1, sh, o); return ptext(c, s, x, y, col, o); }

// ---------- sprites ----------
function billH(c, x, y) { R(c, x, y, 12, 6, "#14532d"); R(c, x + 1, y + 1, 10, 4, "#22c55e"); R(c, x + 1, y + 1, 10, 1, "#86efac"); R(c, x + 5, y + 2, 2, 2, "#166534"); }
function billV(c, x, y) { R(c, x, y, 6, 12, "#14532d"); R(c, x + 1, y + 1, 4, 10, "#22c55e"); R(c, x + 1, y + 1, 1, 10, "#86efac"); R(c, x + 2, y + 5, 2, 2, "#166534"); }
function fajo(c, x, y, n = 3) { for (let i = 0; i < n; i++) billH(c, x + (i % 2), y - i * 3); }
function check(c, x, y, k = 1, col = "#22c55e", sc = 1) { // ✓ de píxeles, k = cuánto se ha dibujado
  const pts = [[0, 4], [1, 5], [2, 6], [3, 5], [4, 4], [5, 3], [6, 2], [7, 1], [8, 0]];
  const n = Math.ceil(pts.length * clamp(k));
  for (let i = 0; i < n; i++) { const [px, py] = pts[i]; R(c, x + px * 2 * sc - 1, y + py * 2 * sc - 1, 4 * sc, 4 * sc, "#0b2a16"); }
  for (let i = 0; i < n; i++) { const [px, py] = pts[i]; R(c, x + px * 2 * sc, y + py * 2 * sc, 2 * sc + 1, 2 * sc + 1, col); }
}
function cruz(c, x, y, sc = 1, col = "#ef4444") {
  for (let i = 0; i < 7; i++) { R(c, x + i * 2 * sc - 1, y + i * 2 * sc - 1, 4 * sc, 4 * sc, "#3b0a0a"); R(c, x + (6 - i) * 2 * sc - 1, y + i * 2 * sc - 1, 4 * sc, 4 * sc, "#3b0a0a"); }
  for (let i = 0; i < 7; i++) { R(c, x + i * 2 * sc, y + i * 2 * sc, 2 * sc + 1, 2 * sc + 1, col); R(c, x + (6 - i) * 2 * sc, y + i * 2 * sc, 2 * sc + 1, 2 * sc + 1, col); }
}
function persona(c, x, y, o) { // personaje de píxeles genérico (pies en y), ~34 px
  const { piel = "#f1c27d", pelo = "#3f2a1d", camisa = "#0ea5e9", pant = "#1e3a8a", gorra = null, bob = 0 } = o;
  y += bob;
  R(c, x - 5, y - 4, 4, 4, "#1f2937"); R(c, x + 1, y - 4, 4, 4, "#1f2937");
  R(c, x - 5, y - 14, 10, 10, pant);
  R(c, x - 7, y - 26, 14, 13, camisa); R(c, x - 9, y - 24, 2, 8, camisa); R(c, x + 7, y - 24, 2, 8, camisa);
  R(c, x - 9, y - 16, 2, 2, piel); R(c, x + 7, y - 16, 2, 2, piel);
  R(c, x - 5, y - 36, 10, 10, piel);
  R(c, x - 5, y - 37, 10, 3, pelo); R(c, x - 6, y - 36, 2, 4, pelo);
  if (gorra) { R(c, x - 6, y - 39, 12, 4, gorra); R(c, x + 2, y - 36, 6, 2, gorra); }
  R(c, x - 3, y - 32, 1, 2, "#111827"); R(c, x + 2, y - 32, 1, 2, "#111827"); R(c, x - 1, y - 28, 3, 1, "#9a3412");
}

// ---------- fondo estático (pared, suelo, decorados) ----------
function fondo() {
  b.imageSmoothingEnabled = false;
  b.fillStyle = "#1d1640"; b.fillRect(0, 0, WW, 214);
  let sd = 11; const rnd = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
  for (let row = 0; row * 8 < 206; row++) {
    const off = (row % 2) * 8;
    for (let x = -16 + off; x < WW; x += 16) {
      const v = rnd(); b.fillStyle = v < 0.33 ? "#2a2152" : v < 0.66 ? "#2c2357" : "#281f4f";
      b.fillRect(x + 1, row * 8 + 1, 15, 7);
      b.fillStyle = "#342b63"; b.fillRect(x + 1, row * 8 + 1, 15, 1);
    }
  }
  R(b, 0, 0, WW, 22, "#171134"); R(b, 0, 22, WW, 2, "#2f2660");
  R(b, 0, 204, WW, 10, "#1b1436"); R(b, 0, 204, WW, 1, "#3a2f6b");
  for (let y = 214, r = 0; y < VH; y += 6, r++) {
    R(b, 0, y, WW, 6, r % 2 ? "#4a3328" : "#4f372b"); R(b, 0, y + 5, WW, 1, "#3a271e");
    for (let x = (r % 3) * 12; x < WW; x += 36) R(b, x, y, 1, 5, "#3a271e");
  }
  R(b, 0, 214, WW, 1, "#6b4a36");
  for (let y = 300; y < VH; y++) R(b, 0, y, WW, 1, `rgba(18,12,34,${Math.min(0.85, (y - 300) / 70).toFixed(2)})`);
  // columnas entre zonas
  for (const px of [212, 428, 644, 860]) {
    R(b, px, 24, 8, 180, "#3d3275"); R(b, px, 24, 2, 180, "#4b3f8c"); R(b, px + 7, 24, 1, 180, "#2a2257");
    R(b, px - 2, 24, 12, 5, "#4b3f8c"); R(b, px - 2, 199, 12, 5, "#4b3f8c");
  }
  // CASA: ventana con luna y cuadro
  R(b, 20, 94, 44, 44, "#4b3f8c"); R(b, 23, 97, 38, 38, "#142350"); R(b, 41, 97, 2, 38, "#4b3f8c"); R(b, 23, 115, 38, 2, "#4b3f8c");
  R(b, 49, 101, 6, 6, "#e2e8f0"); R(b, 51, 101, 4, 2, "#cbd5e1"); [[27, 101], [33, 106], [28, 124], [52, 125], [36, 129], [57, 119]].forEach(([x, y]) => R(b, x, y, 1, 1, "#cbd5e1"));
  R(b, 160, 98, 36, 26, "#a16207"); R(b, 162, 100, 32, 22, "#0f766e"); R(b, 162, 114, 32, 8, "#166534"); R(b, 170, 104, 6, 6, "#fde68a");
  // PAPELES: corcho, escritorio y lámpara
  R(b, 292, 92, 132, 70, "#7c4a2d"); R(b, 294, 94, 128, 66, "#b07a45");
  for (let i = 0; i < 70; i++) R(b, 296 + rnd() * 124, 96 + rnd() * 62, 1, 1, "#9a6638");
  R(b, 300, 182, 104, 5, "#8a5a3b"); R(b, 300, 182, 104, 1, "#a8774f"); R(b, 304, 187, 4, 25, "#5c3a24"); R(b, 396, 187, 4, 25, "#5c3a24");
  R(b, 380, 178, 12, 4, "#334155"); R(b, 385, 160, 2, 18, "#475569"); R(b, 377, 154, 16, 7, "#d97706"); R(b, 377, 154, 16, 1, "#f59e0b");
  R(b, 236, 190, 10, 22, "#9a3412"); R(b, 234, 188, 14, 3, "#c2410c"); R(b, 233, 172, 6, 16, "#16a34a"); R(b, 241, 168, 6, 20, "#15803d"); R(b, 238, 164, 4, 10, "#22c55e");
  // TIENDA: estantes, toldo, mostrador y caja registradora
  for (const y of [126, 150]) { R(b, 444, y, 76, 3, "#7c4a2d"); R(b, 444, y, 76, 1, "#a16207"); }
  [["#b45309", 448, 112], ["#0e7490", 460, 116], ["#be123c", 472, 110], ["#4d7c0f", 486, 114], ["#7c3aed", 498, 112], ["#b45309", 510, 116],
   ["#0e7490", 450, 138], ["#a16207", 462, 136], ["#be123c", 476, 140], ["#4d7c0f", 490, 138], ["#7c3aed", 504, 136]].forEach(([col, x, y]) => { R(b, x, y, 9, (y < 126 ? 126 : 150) - y, col); R(b, x, y, 9, 1, "rgba(255,255,255,.25)"); });
  for (let i = 0; i < 9; i++) R(b, 530 + i * 12, 90, 12, 10, i % 2 ? "#e7d7b0" : "#9f1239");
  for (let i = 0; i < 9; i++) R(b, 532 + i * 12, 100, 8, 3, i % 2 ? "#cdbb93" : "#7f1035");
  R(b, 530, 174, 112, 6, "#a16207"); R(b, 530, 174, 112, 1, "#ca8a04"); R(b, 532, 180, 108, 32, "#7c4a2d");
  for (let x = 540; x < 640; x += 20) R(b, x, 184, 14, 24, "#6b3f24");
  R(b, 610, 160, 26, 14, "#64748b"); R(b, 612, 162, 14, 6, "#0f172a"); R(b, 614, 164, 6, 2, "#4ade80"); R(b, 628, 162, 6, 10, "#475569");
  // BANCO: placa, columnas y cajero
  R(b, 676, 88, 84, 16, "#1e3a5f"); R(b, 676, 88, 84, 1, "#3b82f6"); R(b, 676, 103, 84, 1, "#0f2440");
  for (const x of [662, 834]) { R(b, x, 96, 10, 108, "#5b5f80"); R(b, x, 96, 2, 108, "#6e7398"); R(b, x - 2, 92, 14, 5, "#6e7398"); R(b, x - 2, 200, 14, 4, "#6e7398"); }
  R(b, 760, 138, 42, 74, "#475569"); R(b, 762, 140, 38, 70, "#64748b"); R(b, 762, 140, 38, 4, "#2563eb");
  R(b, 766, 148, 30, 22, "#0f172a"); R(b, 766, 148, 30, 1, "#1e293b");
  for (let r = 0; r < 3; r++) for (let q = 0; q < 3; q++) R(b, 770 + q * 6, 176 + r * 5, 4, 3, "#94a3b8");
  R(b, 790, 178, 8, 2, "#0f172a"); R(b, 770, 194, 24, 2, "#0f172a");
  // HACIENDA: placa, ventanilla y repisa
  R(b, 896, 112, 108, 82, "#3a2f6b"); R(b, 898, 114, 104, 78, "#2e2559");
  R(b, 910, 120, 80, 58, "#0b0816");
  R(b, 904, 178, 92, 8, "#475569"); R(b, 904, 178, 92, 1, "#64748b"); R(b, 940, 180, 20, 2, "#0b0816");
  R(b, 906, 94, 88, 15, "#7f1d1d"); R(b, 906, 94, 88, 1, "#b91c1c");
  R(b, 1016, 190, 10, 22, "#9a3412"); R(b, 1013, 172, 6, 16, "#16a34a"); R(b, 1021, 168, 6, 20, "#15803d");
}

// ---------- estado del mundo en el instante t ----------
function mundo(t) {
  // CASA · cama con billetes que asoman
  if (t >= tPeek) for (let j = 0; j < 3; j++) { const k = eb(prog(t, tPeek + j * 0.09, 0.32)); billV(f, 52 + j * 13, lerp(188, 172, k)); }
  R(f, 12, 172, 6, 34, "#6b3f2a"); R(f, 12, 172, 6, 1, "#8a5a3b");
  R(f, 14, 196, 82, 10, "#6b3f2a"); R(f, 14, 196, 82, 1, "#8a5a3b"); R(f, 16, 206, 4, 6, "#4a2a1a"); R(f, 90, 206, 4, 6, "#4a2a1a");
  R(f, 18, 186, 76, 10, "#cbd5e1"); R(f, 18, 186, 76, 1, "#f1f5f9");
  R(f, 46, 184, 48, 12, "#3b82f6"); R(f, 46, 184, 48, 1, "#60a5fa"); R(f, 46, 195, 48, 1, "#1d4ed8");
  R(f, 20, 180, 22, 7, "#f1f5f9"); R(f, 20, 186, 22, 1, "#cbd5e1");
  // billete que revolotea
  if (t > tFlut && t < tFlut + 1.3) {
    const k = (t - tFlut) / 1.3, y = 172 - 46 * Math.sin(Math.PI * Math.min(k * 1.15, 1)) + (k > 0.87 ? 0 : 0);
    const x = 70 + 22 * k + 5 * Math.sin(k * 12);
    (Math.floor(t * 10) % 2 ? billH : billV)(f, x, y);
  }
  // caja fuerte que se abre
  const ks = eo(prog(t, tSafe, 0.45));
  R(f, 150, 162, 48, 50, "#334155"); R(f, 152, 164, 44, 46, "#475569"); R(f, 152, 164, 44, 1, "#64748b");
  R(f, 155, 167, 38, 40, "#0f172a");
  if (ks > 0) {
    for (let i = 0; i < 4; i++) for (let h = 0; h < 3 + (i % 2); h++) { R(f, 158 + i * 9, 202 - h * 3, 7, 3, "#b45309"); R(f, 158 + i * 9, 202 - h * 3, 7, 1, "#fbbf24"); }
    fajo(f, 160, 186, 2); fajo(f, 176, 186, 3); billH(f, 168, 176);
  }
  const dw = Math.round(38 * (1 - ks));
  if (dw > 1) { R(f, 155, 167, dw, 40, "#64748b"); R(f, 155, 167, dw, 1, "#94a3b8");
    if (dw > 18) { const cx = 155 + dw / 2; R(f, cx - 5, 180, 10, 10, "#94a3b8"); R(f, cx - 3, 182, 6, 6, "#334155"); R(f, cx - 1, 179 + (Math.floor(t * 3) % 2), 2, 4, "#e2e8f0"); R(f, cx + 8, 184, 3, 8, "#cbd5e1"); } }
  if (ks > 0.15) { const ow = Math.round(10 * ks); R(f, 155 - ow, 165, ow, 44, "#64748b"); R(f, 155 - ow, 165, 1, 44, "#94a3b8"); }
  R(f, 153, 210, 6, 2, "#1e293b"); R(f, 189, 210, 6, 2, "#1e293b");
  // lluvia de billetes → montón sin límite
  const N = 60, rate = 14;
  for (let j = 0; j < N; j++) {
    const t0 = tRain + j / rate; if (t < t0) break;
    const row = Math.floor(j / 6), col = j % 6;
    const lx = 140 + col * 11 + (row % 2) * 5, ly = 205 - row * 5;
    const k = prog(t, t0, 0.38);
    if (k < 1) { const sx = 150 + ((j * 37) % 50), y = lerp(96, ly, k * k); (Math.floor((t - t0) * 12 + j) % 2 ? billH : billV)(f, lerp(sx, lx, k), y); }
    else billH(f, lx, ly);
  }
  // sello LEGAL
  if (t > tLegal - 0.05 && t < tPan1 + 0.7) {
    const k = bounce(prog(t, tLegal - 0.05, 0.4)), y = lerp(70, 124, k);
    R(f, 140, y, 66, 18, "#14532d"); R(f, 141, y + 1, 64, 16, "#22c55e"); R(f, 143, y + 3, 60, 12, "#14532d");
    ptext(f, "LEGAL", 160, y + 5, "#bbf7d0"); check(f, 146, y + 4, 1, "#86efac", 0.6);
  }
  // PAPELES: nómina y factura que caen sobre el corcho + check grande
  const papel = (x, y, tit, w) => {
    R(f, x + 2, y + 2, w, 40, "rgba(0,0,0,.35)"); R(f, x, y, w, 40, "#e2e8f0"); R(f, x, y, w, 1, "#f8fafc");
    ptext(f, tit, x + w / 2, y + 5, "#1e293b", { align: "center" });
    for (let i = 0; i < 4; i++) R(f, x + 5, y + 17 + i * 5, w - 10 - (i % 2) * 12, 2, "#94a3b8");
    R(f, x + w / 2 - 2, y - 2, 4, 4, "#ef4444");
  };
  if (t > tNom - 0.15) papel(300, lerp(40, 104, bounce(prog(t, tNom - 0.15, 0.45))), "NÓMINA", 56);
  if (t > tFac - 0.15) papel(362, lerp(40, 108, bounce(prog(t, tFac - 0.15, 0.45))), "FACTURA", 60);
  if (t > tCheck - 0.05) check(f, 334, 112, prog(t, tCheck - 0.05, 0.3), "#22c55e", 2.4);
  // TIENDA: tendero, placas EMPRESA / AUTÓNOMO, fajos 999 € y 1.000 €
  persona(f, 566, 178, { camisa: "#0ea5e9", pelo: "#3f2a1d", bob: Math.floor(t * 2) % 2 });
  R(f, 530, 174, 112, 6, "#a16207"); R(f, 530, 174, 112, 1, "#ca8a04"); // repisa por delante del tendero
  R(f, 610, 160, 26, 14, "#64748b"); R(f, 612, 162, 14, 6, "#0f172a"); R(f, 614, 164, 6, 2, "#4ade80"); R(f, 628, 162, 6, 10, "#475569");

// ---------- Listo en el mundo ----------
function estadoListo(t) {
  // [x del mundo, expr, pose, mira, andando]
  const walk = (a, x0, x1, d = 0.6) => lerp(x0, x1, eio(prog(t, a, d)));

  x = walk(tPan1, x, 262); x = walk(tPan2, x, 478); x = walk(tPan3, x, 722); x = walk(tCom - 0.05, x, 846, 0.7);
  const andando = [tPan1, tPan2, tPan3, tCom - 0.05].some((a) => t > a && t < a + 0.62);
  let expr = "normal", pose = "reposo", mira = [0, 0];
  if (t < tPeek) { expr = "sorpresa"; pose = "saludo"; }
  else if (t < tRain) { expr = t < tSafe ? "sorpresa" : "feliz"; pose = "senala"; mira = [1, 0.3]; }
  else if (t < tLim) { expr = "feliz"; pose = "reposo"; mira = [1, -0.5]; }
  else if (t < tPan1) { expr = "feliz"; pose = "celebra"; }
  else if (t < tPiensa) { expr = "normal"; }
  else if (t < tCheck) { expr = "normal"; pose = "piensa"; mira = [1, -0.6]; }
  else if (t < tPan2) { expr = "idea"; pose = "senala"; mira = [1, -0.6]; }
  else if (t < tMil + 0.28) { expr = "normal"; pose = "senala"; mira = [1, 0]; }
  else if (t < tPan3) { expr = "preocupado"; pose = "reposo"; mira = [1, 0]; }
  else if (t < tTres) { expr = "normal"; pose = "senala"; mira = [1, 0]; }
  else if (t < tCom) { expr = "sorpresa"; pose = "reposo"; mira = [1, -0.6]; }
  else if (t < tCTA) { expr = t < tHac ? "normal" : "preocupado"; pose = t < tHac ? "reposo" : "piensa"; mira = [1, -0.4]; }
  else if (t < tListo) { expr = "feliz"; pose = "saludo"; }
  else { expr = "guino"; pose = "pulgar"; }
  return { x, expr, pose, mira, andando };
}

const CLAVES = [["efectivo"], ["límite", "legal"], ["de", "dónde", "sale"], ["menos", "de", "mil", "euros"], ["tres", "mil", "hacienda"], ["listo"]];

function menu(t) {

};
