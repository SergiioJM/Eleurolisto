  g.position.copy(bez(p0, p1, p2, p3, e));
  g.position.y += Math.sin(k * Math.PI * 3) * 0.05;
  g.rotation.set(Math.sin(k * 5) * 0.6, k * 5.5, Math.sin(k * 3.2) * 0.5);
  g.scale.setScalar(1 - 0.35 * easeIn(k));
  return true;
}

// ---------- personaje ----------
const yo = L.persona({});
yo.root.position.set(1.5, 0, 0.42); yo.root.rotation.y = -0.85; esc.add(yo.root);

// ---------- luces ----------
const hemi = new THREE.HemisphereLight(0xdfe8ff, 0x5a3a28, 1); esc.add(hemi);
const sol = new THREE.DirectionalLight(0xfff0d6, 3); sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048); Object.assign(sol.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 40 });
sol.shadow.bias = -0.0004; sol.shadow.normalBias = 0.03; sol.shadow.radius = 3;
sol.target.position.set(0.5, 0, -0.8); esc.add(sol, sol.target);
const luna = new THREE.DirectionalLight(0x8fa6ff, 0.0); luna.position.set(-3, 7, -6); esc.add(luna);
const amb = new THREE.AmbientLight(0xffe6c8, 0.25); esc.add(amb);
const relleno = new THREE.DirectionalLight(0xfff3e0, 0.9); relleno.position.set(2, 4, 8); relleno.target.position.set(0, 1, -1); esc.add(relleno, relleno.target);

// hora del día: 0 = medianoche, 0.25 amanecer, 0.5 mediodía, 0.75 atardecer
const CIELO = [[0, "#121a36"], [0.21, "#24305a"], [0.26, "#f2a066"], [0.31, "#a9d0f0"], [0.5, "#8fc3f0"], [0.69, "#a6c4e2"], [0.745, "#f28a4e"], [0.79, "#5a3f6e"], [0.85, "#1b2244"], [1, "#121a36"]];
const colCielo = (h) => { for (let i = 0; i < CIELO.length - 1; i++) if (h <= CIELO[i + 1][0]) return new THREE.Color(CIELO[i][1]).lerp(new THREE.Color(CIELO[i + 1][1]), (h - CIELO[i][0]) / (CIELO[i + 1][0] - CIELO[i][0])); return new THREE.Color(CIELO[0][1]); };
function hora(t) {
  if (t < T1 - 0.6) return 0.96 + 0.01 * (t / T1);
  if (t < T1 + 0.7) return lerp(0.97, 1.31, easeInOut(prog(t, T1 - 0.6, 1.3)));
  if (t < T3) return lerp(1.31, 1.37, prog(t, T1 + 0.7, T3 - T1 - 0.7));
  if (t < TLfin) return 1.37 + (3.74 - 1.37) * (anyos(t) / 10);
  if (t < T6) return lerp(3.74, 3.79, prog(t, TLfin, T6 - TLfin));
  return lerp(3.79, 3.84, prog(t, T6, DUR - T6));
}
function luz(t) {
  const h = ((hora(t) % 1) + 1) % 1;
  const c = colCielo(h); cielo.material.color.copy(c);
  const u = (h - 0.25) / 0.5, dia = u > 0 && u < 1 ? smooth(clamp(u / 0.09)) * smooth(clamp((1 - u) / 0.09)) : 0;
  sol.intensity = 3.4 * dia;
  sol.color.setHSL(0.09, 0.85, lerp(0.62, 0.9, Math.sin(Math.PI * clamp(u))));
  sol.position.set(lerp(7.5, -7.5, clamp(u)), 1.6 + 6.5 * Math.sin(Math.PI * clamp(u)), -9);
  const noche = 1 - dia;
  luna.intensity = 0.45 * noche;
  hemi.intensity = lerp(0.8, 1.7, dia);
  relleno.intensity = lerp(0.45, 0.9, dia); relleno.color.copy(new THREE.Color(0xc9d2ff).lerp(new THREE.Color(0xfff3e0), dia));
  hemi.color.copy(new THREE.Color(0x9fb0ff).lerp(new THREE.Color(0xdfe8ff), dia));
  const parpadeo = t < 1.2 ? 1 - 0.7 * Math.max(0, Math.sin(t * 47) * Math.sin(t * 13)) * Math.sin(Math.PI * clamp(t / 1.2)) : 1;
  luzLamp.intensity = lerp(0.6, 7.0, smooth(clamp(noche * 1.2))) * parpadeo;
  bombMat.color.set(noche > 0.4 ? 0xfff1c9 : 0xd8d2c0);
  edifMat.color.copy(new THREE.Color(0x8aa0b8).lerp(new THREE.Color(0x1a2036), smooth(noche)));
  luzMat.opacity = smooth(clamp((noche - 0.5) * 2));
  const horas = h * 24; agH.rotation.z = -(horas / 12) * Math.PI * 2; agM.rotation.z = -(horas % 1) * Math.PI * 2;
}

// ---------- cámara ----------
const camara = L.camaraSuave([
  { t: 0, p: [-0.75, 1.95, 2.95], m: [0.65, 1.55, -1.4], fov: 52 },
  { t: 2.4, p: [-0.5, 1.95, 2.45], m: [1.0, 1.85, -2.0], fov: 50 },
  { t: T1 - 0.2, p: [-0.45, 2.0, 2.3], m: [1.15, 1.95, -2.2], fov: 50 },
  { t: T1 + 0.75, p: [-1.65, 2.75, -0.55], m: [-2.5, 0.72, -2.62], fov: 50 },
  { t: T2 - 0.15, p: [-1.75, 2.6, -0.8], m: [-2.5, 0.72, -2.62], fov: 48 },
  { t: T2 + 0.7, p: [0.05, 3.7, 2.7], m: [0.0, 0.8, -0.45], fov: 50 },
  { t: T3 - 0.1, p: [-0.1, 3.5, 2.5], m: [0.0, 0.8, -0.45], fov: 50 },
  { t: T3 + 1.1, p: [0.0, 2.3, 4.8], m: [0.75, 1.4, -1.2], fov: 54 },
  { t: TLfin - 0.2, p: [1.2, 2.2, 4.9], m: [0.7, 1.4, -1.2], fov: 54 },
  { t: T5 + 0.55, p: [0.45, 1.85, 3.3], m: [1.5, 1.45, 0.3], fov: 48 },
  { t: T6 + 0.4, p: [0.4, 1.85, 3.45], m: [1.45, 1.4, 0.3], fov: 48 },
  { t: DUR, p: [0.2, 2.5, 5.4], m: [0.6, 1.3, -1.0], fov: 54 },
], 0.32);
const mira = L.camaraSuave([
  { t: 0, p: [0, 0, 0], m: [0.6, 1.6, -0.9], fov: 1 },
  { t: T1 + 0.2, p: [0, 0, 0], m: [-2.4, 0.9, -2.8], fov: 1 },
  { t: T2 + 0.4, p: [0, 0, 0], m: [0, 0.95, -0.45], fov: 1 },
  { t: T5 - 0.2, p: [0, 0, 0], m: [0, 0.95, -0.45], fov: 1 },
  { t: T5 + 0.4, p: [0, 0, 0], m: [0.45, 1.85, 3.3], fov: 1 },
  { t: DUR, p: [0, 0, 0], m: [0.4, 1.9, 4.5], fov: 1 },
], 0.25);

// ---------- capas 2D ----------
const $ = (id) => document.getElementById(id);
const subs = L.subtitulos($("subs"), TIM, {
  sust: [{ de: ["diez", "mil", "euros"], a: "10.000 €" }, { de: ["tres", "por", "ciento"], a: "3 %" }, { de: ["diez", "años"], a: "10 años" }],
  clave: ["ladrón", "10.000", "desaparece", "inflaci", "3 %", "cuarta", "parte", "encoge", "trabajando"],
});
const barra = $("barra"); barra.innerHTML = S.map(() => "<i><b></b></i>").join("");
const ancla = new THREE.Vector3(CX, 1.0, CZ + 0.62);

window.renderAt = (t) => {
  luz(t);
  // productos
  for (const p of prod) {
    const g = p.g; g.visible = true; g.rotation.set(0, 0, 0); g.scale.setScalar(1); g.position.copy(g.userData.base);
    if (t < T1) { if (p.nombre === "aceite") vuelo(p, t, tRoboGancho, 2.0); continue; }
    const k = prog(t, p.tPop, 0.38);
    if (k <= 0) { g.visible = false; continue; }
    g.scale.setScalar(Math.max(0.001, easeBack(k, 2.2)));
    g.position.y += (1 - easeOut(k)) * 0.35;
    if (p.tRobo !== undefined) vuelo(p, t, p.tRobo);
  }
  pufs[0](t, tRoboGancho + 0.3, byName["aceite"].g.userData.base.clone().add(v3([0, 0.1, 0])));
  robos.forEach(([n], i) => pufs[i + 1](t, byName[n].tRobo + 0.3, byName[n].g.userData.base.clone().add(v3([0, 0.1, 0]))));
  // cajón
  cajon.position.z = CZ + 0.3 + 0.44 * easeOut(prog(t, T1 + 0.45, 0.7)) * (t >= T1 - 0.3 ? 1 : 0);
  // lámpara
  lamp.rotation.z = Math.sin(t * 1.3) * 0.035; lamp.rotation.x = Math.sin(t * 0.9) * 0.025;
  // personaje
  const p = yo; p.root.position.y = 0;
  p.torso.scale.y = 1 + 0.012 * Math.sin((t / 3.1) * Math.PI * 2);
  let armX = 0.05 * Math.sin(t * 2), armZ = 0.06;
  let robando = null;
  for (const [n] of robos) { const q = byName[n]; if (t > q.tRobo - 0.1 && t < q.tRobo + 1.6) robando = { g: q.g, t0: q.tRobo }; }
  if (t < T1 && t > tRoboGancho - 0.1 && t < tRoboGancho + 1.7) robando = { g: byName["aceite"].g, t0: tRoboGancho };
  for (const [n] of robos) {
    const k = prog(t, byName[n].tRobo + 0.25, 0.5);
    if (k > 0 && k < 1) { const s = Math.sin(Math.PI * k); p.root.position.y = 0.16 * s; armX -= 1.1 * s; armZ += 0.35 * s; }
  }
  const kSel = easeOut(prog(t, tSello - 0.25, 0.4)), kShr = easeInOut(prog(t, tTuyo - 0.3, 0.55));
  armX = lerp(armX, -2.72, kSel * (1 - kShr)); armZ = lerp(armZ, 0.36, kSel * (1 - kShr));
  armX = lerp(armX, -0.55, kShr); armZ = lerp(armZ, -0.5, kShr);
  p.brazoI.rotation.set(armX, 0, armZ); p.brazoD.rotation.set(armX, 0, -armZ);
  p.root.rotation.y = lerp(-0.85, -0.35, easeInOut(prog(t, T5 - 0.2, 0.8)));
  const m = mira(t).m;
  const objetivo = v3(m);
  if (robando && robando.g.visible) { const w = smooth(clamp(Math.min(t - robando.t0 + 0.1, robando.t0 + 1.6 - t) / 0.3)); objetivo.lerp(robando.g.getWorldPosition(new THREE.Vector3()), w); }
  L.mirarA(p, objetivo, 1);
  const susto = Math.max(kSel * (1 - kShr), ...robos.map(([n]) => Math.sin(Math.PI * prog(t, byName[n].tRobo + 0.2, 0.7))));
  p.boca.scale.set(1 - 0.3 * susto, 1 + 2.6 * susto, 1);
  p.cejas.forEach((c) => (c.position.y = 0.335 + 0.035 * susto));
  // cámara (+ temblor al sellar)
  const c = camara(t);
  const sh = Math.exp(-Math.max(0, t - tSello) * 7) * (t > tSello ? 1 : 0) * 0.05;
  cam.position.set(c.p[0] + Math.sin(t * 0.7) * 0.03 + Math.sin(t * 61) * sh, c.p[1] + Math.sin(t * 0.53) * 0.02 + Math.cos(t * 53) * sh, c.p[2]);
  cam.lookAt(...c.m); cam.fov = c.fov; cam.updateProjectionMatrix();
  r.render(esc, cam);

  // ----- 2D -----
  subs(t);
  L.portada($("portada"), t, 1.05);
  $("subs").style.visibility = t < 1.25 ? "hidden" : "visible";
  [...barra.children].forEach((el, i) => { const a = st(i), b = i < S.length - 1 ? st(i + 1) : DUR; el.firstChild.style.width = 100 * clamp((t - a) / (b - a)) + "%"; });
  const kp = easeOut(prog(t, T3 - 0.35, 0.45)), panel = $("panel");
  panel.style.opacity = kp * (1 - 0.65 * prog(t, tSello - 0.2, 0.3));
  panel.style.transform = `translateX(${(1 - kp) * -60}px)`;
  const y = anyos(t), n = Math.floor(y + 1e-6);
  $("n").textContent = n; $("nlab").textContent = n === 1 ? "año" : "años";
  const val = compra(y); $("compra").textContent = L.fmtEur(val);
  $("compra").style.color = `rgb(255,${Math.round(lerp(255, 110, clamp((10000 - val) / 2559)))},${Math.round(lerp(255, 95, clamp((10000 - val) / 2559)))})`;
  const kt = easeBack(prog(t, T1 + 0.9, 0.4), 2) * (1 - prog(t, T2 + 0.25, 0.25));
  const sp = ancla.clone().project(cam), tag = $("tag");
  tag.style.opacity = clamp(kt * 3); tag.style.left = (sp.x * 0.5 + 0.5) * W + "px"; tag.style.top = (-sp.y * 0.5 + 0.5) * H + "px";
  tag.style.transform = `translate(-50%,-100%) scale(${Math.max(0, kt)})`;
  const ks = prog(t, tSello, 0.22), sello = $("sello");
  sello.style.opacity = (ks > 0 ? 1 : 0) * (1 - prog(t, tTuyo - 0.35, 0.3));
  sello.firstChild.style.transform = `rotate(-7deg) scale(${lerp(2.3, 1, easeOut(ks))})`;
  sello.lastChild.style.opacity = easeOut(prog(t, tSello + 0.35, 0.3));
  $("marca").style.opacity = (1 - prog(t, tTuyo - 0.2, 0.3)) * prog(t, 1.2, 0.3);
  const kc = prog(t, tTuyo, 0.45), cta = $("cta");
  cta.style.opacity = kc > 0 ? 1 : 0;
  [...cta.children].forEach((el, i) => { const k = easeBack(prog(t, tTuyo + i * 0.18, 0.4), 1.8); el.style.transform = `translateY(${(1 - k) * 80}px) scale(${0.6 + 0.4 * k})`; el.style.opacity = clamp(k * 2); });
};
window.listo = true;
</script></body></html>
