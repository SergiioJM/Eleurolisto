<script>
// R8b · NEÓN TROPICAL DE NOCHE (parte 3 del especial GTA): misma costa de noche que la parte 2. Tema: ¿y si los 60 € de 2013
// hubieran ido a un índice de 500 empresas? Rejilla de 500 luces (una por empresa), contador 60 → casi 300 €, barras
// Take-Two / índice / THQ, una luz que se apaga (quiebra) y el ticker de la peor semana. Sin logos, personajes ni tipografías del juego.
const C = document.getElementById('c'), X = C.getContext('2d');
const TIM = window.TIM, S = TIM.segments;
const DUR = (window.DURACION = TIM.total);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, d) => clamp((t - a) / d);

const eback = (k, s = 1.7) => { k = clamp(k); return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const st = (i) => S[i].start, en = (i) => S[i].start + S[i].dur;
const pal = (i, f, n = 0) => { const ws = S[i].words.filter((w) => w.w.toLowerCase().includes(f)); return (ws[n] || ws[0] || S[i].words[0]).start; };
const T = {
  gta: pal(0, 'gta'), parte: pal(0, '3'), empresa0: pal(0, 'empresa'), q0: pal(0, '500'),
  mismos: st(1), sesenta: pal(1, '60'), anio: pal(1, '2013'), indice: pal(1, 'índice'), q1: pal(1, '500'), unidos: pal(1, 'unidos'),
  hoy: st(2), tres: pal(2, '300'), cinco: pal(2, '5'),
  menos: st(3), take: pal(3, 'take'), vale: pal(3, 'vale'),
  pero: st(4), quiebra: pal(4, 'quiebra'), cero: pal(4, '0.'),
  y: st(5), peor: pal(5, 'peor'), wall: pal(5, 'wall'), anio25: pal(5, '2025'),
  cta: st(6), una: pal(6, 'una'), q6: pal(6, '500'), fin: en(6),
};
const PAL = { rosa: '#ff3d8b', rosa2: '#ff7ac0', cian: '#34e5ff', amb: '#FFC547', verde: '#4ADE80', rojo: '#ff4d5e', tinta: '#120820', morado: '#2a0f45' };

// ---------- texto de cómic: relleno, contorno grueso y sombra de color ----------
function comic(s, x, y, size, fill, { stroke = PAL.tinta, sw = 0.16, sombra = PAL.rosa, ital = true, align = 'center', peso = 900 } = {}) {
  X.font = `${ital ? 'italic ' : ''}${peso} ${size}px Inter`; X.textAlign = align; X.textBaseline = 'middle'; X.lineJoin = 'round';
  if (sombra) { X.fillStyle = sombra; X.fillText(s, x + size * 0.06, y + size * 0.07); X.strokeStyle = sombra; X.lineWidth = size * sw; X.strokeText(s, x + size * 0.06, y + size * 0.07); }
  X.strokeStyle = stroke; X.lineWidth = size * sw; X.strokeText(s, x, y); X.fillStyle = fill; X.fillText(s, x, y);
}
function rr(x, y, w, h, r, fill, stroke, lw) { X.beginPath(); X.roundRect(x, y, w, h, r); if (fill) { X.fillStyle = fill; X.fill(); } if (stroke) { X.strokeStyle = stroke; X.lineWidth = lw || 4; X.stroke(); } }
function neonRect(x, y, w, h, r, col, lw = 6) { // marco de neón ESTABLE (sin parpadeo)
  X.save(); X.shadowColor = col; X.shadowBlur = 24; X.strokeStyle = col; X.lineWidth = lw; X.beginPath(); X.roundRect(x, y, w, h, r); X.stroke();
  X.shadowBlur = 0; X.strokeStyle = 'rgba(255,255,255,.75)'; X.lineWidth = lw * 0.35; X.stroke(); X.restore();
}
function panel(x, y, w, h, k, col = PAL.rosa) { // tarjeta oscura con neón: entra con rebote, sin aclarar la pantalla
  X.save(); X.globalAlpha *= clamp(k * 2); X.translate(x, y + (1 - eback(k)) * 70); const s = 0.86 + 0.14 * eback(k); X.scale(s, s); X.rotate(-0.025);
  rr(-w / 2 + 10, -h / 2 + 14, w, h, 26, 'rgba(5,0,14,.5)'); rr(-w / 2, -h / 2, w, h, 26, 'rgba(22,6,40,.93)'); neonRect(-w / 2, -h / 2, w, h, 26, col);
  return () => X.restore();
}
function sello(s, x, y, k, col, size = 80, rot = -8) {
  if (k <= 0) return; X.save(); X.translate(x, y); X.rotate(rot * Math.PI / 180); const sc = lerp(2.2, 1, eout(k)); X.scale(sc, sc); X.globalAlpha *= clamp(k * 3);
  X.font = `italic 900 ${size}px Inter`; const w = X.measureText(s).width + 70; rr(-w / 2, -size * 0.75, w, size * 1.5, 20, 'rgba(22,6,40,.92)'); neonRect(-w / 2, -size * 0.75, w, size * 1.5, 20, col, 7);
  comic(s, 0, 4, size, col, { sombra: null }); X.restore();
}
// iconos propios (sin marcas): mando genérico y flecha de gráfica
function iconoMando(x, y, s, col = PAL.rosa) {
  X.save(); X.translate(x, y); X.scale(s, s);
  X.beginPath(); X.moveTo(-64, -22); X.quadraticCurveTo(0, -36, 64, -22); X.quadraticCurveTo(92, -16, 96, 22); X.quadraticCurveTo(98, 50, 74, 50);
  X.quadraticCurveTo(56, 50, 44, 26); X.lineTo(-44, 26); X.quadraticCurveTo(-56, 50, -74, 50); X.quadraticCurveTo(-98, 50, -96, 22); X.quadraticCurveTo(-92, -16, -64, -22); X.closePath();
  X.fillStyle = '#2b2140'; X.fill(); X.save(); X.shadowColor = col; X.shadowBlur = 14; X.strokeStyle = col; X.lineWidth = 6; X.stroke(); X.restore();
  X.fillStyle = '#cfd6e6'; X.fillRect(-66, -6, 30, 10); X.fillRect(-56, -16, 10, 30);
  [[50, -10, PAL.rosa], [66, 4, PAL.cian], [34, 4, PAL.amb], [50, 18, PAL.verde]].forEach(([bx, by, c]) => { X.fillStyle = c; X.beginPath(); X.arc(bx, by, 7, 0, 7); X.fill(); });
  X.restore();
}
function iconoGrafica(x, y, s, col = PAL.verde, k = 1) {
  X.save(); X.translate(x, y); X.scale(s, s); X.lineJoin = 'round'; X.lineCap = 'round';
  const pts = [[-80, 40], [-40, 10], [-10, 26], [30, -18], [80, -50]]; const n = Math.max(1, Math.floor(k * (pts.length - 1) * 100) / 100);
  X.save(); X.shadowColor = col; X.shadowBlur = 16; X.strokeStyle = col; X.lineWidth = 12; X.beginPath(); X.moveTo(...pts[0]);
  for (let i = 1; i < pts.length; i++) { const f = clamp(n - (i - 1)); if (f <= 0) break; X.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)); } X.stroke(); X.restore();
  if (k >= 1) { X.fillStyle = col; X.beginPath(); X.moveTo(92, -60); X.lineTo(52, -58); X.lineTo(80, -24); X.closePath(); X.fill(); }
  X.restore();
}

// ---------- el mundo de noche (paralaje) ----------
const VEL = 480;
let EDIF = [], EST = [];
(function () {
  let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  let x = -200; while (x < 4000) { const w = 70 + r() * 120, h = 140 + r() * 380; EDIF.push({ x, w, h, deco: r() < 0.4, neon: r() < 0.5 ? PAL.rosa : PAL.cian, ven: r() }); x += w + 8 + r() * 30; }
  for (let i = 0; i < 90; i++) EST.push([r() * 1080, r() * 760, 1 + r() * 2.2]);
})();
const HOR = 1080;
function cielo() {
  const g = X.createLinearGradient(0, 0, 0, HOR); g.addColorStop(0, '#07021a'); g.addColorStop(0.45, '#1c0a3e'); g.addColorStop(0.78, '#55136a'); g.addColorStop(1, '#a3246e');
  X.fillStyle = g; X.fillRect(0, 0, 1080, HOR);
  X.fillStyle = 'rgba(255,240,255,.75)'; for (const [x, y, r] of EST) { X.beginPath(); X.arc(x, y, r, 0, 7); X.fill(); } // estrellas fijas
}
function luna() {
  const lx = 800, ly = 560, r = 95;
  const h = X.createRadialGradient(lx, ly, r * 0.8, lx, ly, r * 3); h.addColorStop(0, 'rgba(200,220,255,.28)'); h.addColorStop(1, 'rgba(200,220,255,0)');
  X.fillStyle = h; X.fillRect(lx - r * 3, ly - r * 3, r * 6, r * 6);
  X.fillStyle = '#f3f0ff'; X.beginPath(); X.arc(lx, ly, r, 0, 7); X.fill();
  X.fillStyle = 'rgba(180,170,220,.45)'; [[-30, -20, 18], [25, 15, 24], [-10, 40, 12]].forEach(([dx, dy, rr2]) => { X.beginPath(); X.arc(lx + dx, ly + dy, rr2, 0, 7); X.fill(); });
}
function skyline(t) {
  const off = (t * VEL * 0.08) % 3600;
  for (const b of EDIF) {
    let x = b.x - off; if (x + b.w < -50) x += 3600; if (x > 1130) continue;
    const top = HOR - b.h;
    X.fillStyle = '#1d0a30'; X.fillRect(x, top, b.w, b.h);
    if (b.deco) { X.fillRect(x + b.w * 0.25, top - 30, b.w * 0.5, 30); X.fillRect(x + b.w * 0.42, top - 70, b.w * 0.16, 40); }
    X.fillStyle = 'rgba(255,214,140,.7)';
    for (let yy = top + 16; yy < HOR - 14; yy += 26) for (let xx = x + 10; xx < x + b.w - 12; xx += 20) if (((xx * 7 + yy * 3) | 0) % 5 < 1 + b.ven * 2) X.fillRect(xx, yy, 8, 11);
    if (b.deco) { X.save(); X.shadowColor = b.neon; X.shadowBlur = 16; X.strokeStyle = b.neon; X.lineWidth = 4; X.strokeRect(x + 3, top + 3, b.w - 6, b.h); X.restore(); }
  }
  const nx = 300 - ((t * VEL * 0.08) % 3600); if (nx > -300 && nx < 1200) { X.save(); X.shadowColor = PAL.rosa; X.shadowBlur = 18; X.font = 'italic 900 44px Inter'; X.fillStyle = '#ffd1e6'; X.textAlign = 'center'; X.fillText('LISTO BANK', nx, HOR - 360); X.restore(); }
}
function mar(t) {
  const g = X.createLinearGradient(0, HOR, 0, 1290); g.addColorStop(0, '#6a1a6e'); g.addColorStop(0.4, '#3a1158'); g.addColorStop(1, '#170733');
  X.fillStyle = g; X.fillRect(0, HOR, 1080, 210);
  for (let i = 0; i < 12; i++) { const y = HOR + 8 + i * 15, w = 170 - i * 10, x = 800 - w / 2 + Math.sin(t * 2 + i) * 16; X.fillStyle = `rgba(230,230,255,${0.5 - i * 0.035})`; X.fillRect(x, y, w, 4); }
}
function palmera(x, base, h, inc, t, col) {
  X.save(); X.translate(x, base); X.strokeStyle = col; X.lineCap = 'round';
  X.lineWidth = 16; X.beginPath(); X.moveTo(0, 0); X.quadraticCurveTo(h * inc * 0.5 + 10, -h * 0.5, h * inc, -h); X.stroke();
  X.translate(h * inc, -h); X.fillStyle = col;
  for (let k = 0; k < 7; k++) { const a = -Math.PI / 2 + (k - 3) * 0.52 + Math.sin(t * 1.4 + k) * 0.05; X.save(); X.rotate(a); X.beginPath(); X.moveTo(0, -6); X.quadraticCurveTo(70, -26, 140, 10); X.quadraticCurveTo(70, 4, 0, 6); X.fill(); X.restore(); }
  X.restore();
}
function playa(t) {
  X.fillStyle = '#5a2a5c'; X.fillRect(0, 1290, 1080, 40);
  const off = (t * VEL * 0.45) % 330;
  for (let i = -1; i < 5; i++) palmera(i * 330 - off + 120, 1320, 300 + (i % 2) * 70, 0.12 + (i % 3) * 0.05, t, '#12051d');
}
function carretera(t) {
  X.fillStyle = '#211330'; X.fillRect(0, 1330, 1080, 170);
  X.fillStyle = '#ffcf6a'; const off = (t * VEL) % 160; for (let x = -off; x < 1100; x += 160) X.fillRect(x, 1412, 80, 8);
  X.fillStyle = '#3a2250'; X.fillRect(0, 1330, 1080, 10);
  X.fillStyle = '#150a1f'; X.fillRect(0, 1500, 1080, 420);
  X.save(); X.shadowColor = PAL.cian; X.shadowBlur = 16; X.fillStyle = PAL.cian; X.fillRect(0, 1506, 1080, 6); X.restore();
  X.fillStyle = '#22122f'; const of4 = (t * VEL) % 120; for (let x = -of4; x < 1100; x += 120) X.fillRect(x, 1540, 112, 60);
  const of2 = (t * VEL) % 540;
  for (let x = -of2; x < 1200; x += 540) { X.fillStyle = '#0c0512'; X.fillRect(x, 1210, 10, 130); X.fillRect(x - 30, 1210, 40, 8); const g = X.createRadialGradient(x - 26, 1222, 4, x - 26, 1222, 110); g.addColorStop(0, 'rgba(255,214,150,.7)'); g.addColorStop(1, 'rgba(255,214,150,0)'); X.fillStyle = g; X.fillRect(x - 140, 1110, 230, 230); }
  const of3 = (t * VEL * 1.5) % 1400;
  palmera(1300 - of3, 1920, 640, -0.18, t, '#06020b'); palmera(2000 - of3, 1920, 560, 0.15, t, '#06020b');
}
function coche(t, cx, cy, listo) { // descapotable genérico de los 80 (cian), vista lateral, con faros encendidos
  const bob = Math.sin(t * 9) * 2;
  X.save(); X.translate(cx, cy + bob);
  // haz de los faros (fijo)
  const g = X.createLinearGradient(250, 0, 620, 0); g.addColorStop(0, 'rgba(255,240,190,.35)'); g.addColorStop(1, 'rgba(255,240,190,0)');
  X.fillStyle = g; X.beginPath(); X.moveTo(250, -12); X.lineTo(640, -70); X.lineTo(640, 60); X.lineTo(250, 4); X.closePath(); X.fill();
  if (listo) listo();
  X.fillStyle = '#28d7f0'; X.beginPath(); X.moveTo(-250, 10); X.lineTo(-240, -40); X.lineTo(-120, -52); X.lineTo(-60, -52); X.lineTo(30, -50); X.lineTo(200, -40); X.lineTo(250, -10); X.lineTo(252, 22); X.lineTo(-250, 22); X.closePath(); X.fill();
  X.strokeStyle = PAL.tinta; X.lineWidth = 7; X.stroke();
  X.fillStyle = PAL.rosa; X.fillRect(-235, -8, 480, 9);
  X.strokeStyle = '#e8fdff'; X.lineWidth = 6; X.beginPath(); X.moveTo(40, -50); X.lineTo(-10, -110); X.stroke();
  for (const wx of [-160, 160]) { X.fillStyle = PAL.tinta; X.beginPath(); X.arc(wx, 24, 46, 0, 7); X.fill(); X.fillStyle = '#cfd6e6'; X.beginPath(); X.arc(wx, 24, 22, 0, 7); X.fill();
    X.save(); X.translate(wx, 24); X.rotate(t * 14); X.strokeStyle = '#6b7280'; X.lineWidth = 5; for (let k = 0; k < 5; k++) { X.rotate(1.2566); X.beginPath(); X.moveTo(0, 0); X.lineTo(20, 0); X.stroke(); } X.restore(); }
  X.fillStyle = '#fff6cc'; X.fillRect(238, -14, 14, 12);
  X.fillStyle = PAL.rojo; X.fillRect(-252, -6, 10, 10);
  X.restore();
}

// ---------- capa: subtítulos, tarjetas, CTA ----------
const CLAVE = ['gta,', '3:', '500?', '500', '60 €', '2013,', 'índice', '300 €:', '5', 'take-two,', 'quiebra,', '0.', 'peor', '2025.', 'empresa'];
const TROZOS = [];
S.forEach((s) => { let cur = []; s.words.forEach((w) => { const len = cur.map((x) => x.w).join(' ').length + w.w.length; if (cur.length >= 3 || (cur.length && len > 15)) { TROZOS.push(cur); cur = []; } cur.push(w); }); if (cur.length) TROZOS.push(cur); });
function subtitulos(t) {
  let tr = null; for (const c of TROZOS) if (t >= c[0].start - 0.06) tr = c;
  if (!tr || t > tr[tr.length - 1].end + 0.5) return;
  const k = eback(prog(t, tr[0].start - 0.06, 0.18), 2);
  X.font = 'italic 900 84px Inter'; const sp = 24, ws = tr.map((w) => X.measureText(w.w).width), tot = ws.reduce((a, b) => a + b, 0) + sp * (tr.length - 1);
  const esc = Math.min(1, 980 / tot);
  X.save(); X.translate(540, 925); X.scale((0.85 + 0.15 * k) * esc, (0.85 + 0.15 * k) * esc); X.translate(-540, -925);
  let x = 540 - tot / 2;
  tr.forEach((w, i) => { const on = t >= w.start - 0.03, cl = CLAVE.includes(w.w.toLowerCase()); comic(w.w, x, 925, 84, on ? (cl ? PAL.amb : '#ffffff') : 'rgba(255,255,255,.55)', { align: 'left', sombra: on ? PAL.rosa : null }); x += ws[i] + sp; });
  X.restore();
}
// rejilla de 500 luces (25 x 20): una por empresa. n = cuántas encendidas; rota = índice de la que se apaga
function rejilla(cx, cy, paso, n, { rota = -1, kRota = 0, r = 0.36 } = {}) {
  const cols = 25, filas = 20, cols3 = [PAL.verde, PAL.cian, PAL.amb, PAL.rosa2];
  for (let i = 0; i < 500; i++) {
    const c = i % cols, f = Math.floor(i / cols), x = cx + (c - (cols - 1) / 2) * paso, y = cy + (f - (filas - 1) / 2) * paso;
    const on = clamp(n - i); X.fillStyle = 'rgba(255,255,255,.10)'; X.fillRect(x - paso * r, y - paso * r, paso * r * 2, paso * r * 2);
    if (on <= 0) continue;
    let col = cols3[(c * 7 + f * 3) % 4], a = on, dy = 0;
    if (i === rota && kRota > 0) { col = PAL.rojo; a = 1 - clamp((kRota - 0.35) / 0.65); dy = eio(clamp((kRota - 0.35) / 0.65)) * 90; }
    X.globalAlpha *= 1; X.save(); X.globalAlpha *= a; X.fillStyle = col; X.fillRect(x - paso * r, y - paso * r + dy, paso * r * 2, paso * r * 2); X.restore();
  }
}
function moneda60(x, y, s, k = 1) {
  X.save(); X.translate(x, y); X.scale(s * k, s * k); X.fillStyle = PAL.amb; X.beginPath(); X.arc(0, 0, 70, 0, 7); X.fill(); X.strokeStyle = PAL.tinta; X.lineWidth = 8; X.stroke();
  X.strokeStyle = 'rgba(18,8,32,.35)'; X.lineWidth = 4; X.beginPath(); X.arc(0, 0, 54, 0, 7); X.stroke(); comic('60 €', 0, 4, 46, PAL.tinta, { stroke: PAL.amb, sw: 0.05, sombra: null, ital: false }); X.restore();
}
function capa(t) {
  // kicker
  X.save(); X.globalAlpha = eout(prog(t, 0, 0.3)); rr(540 - 270, 150, 540, 66, 33, PAL.rosa); X.font = '800 30px Inter'; X.fillStyle = '#fff'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText('ESPECIAL GTA 6 · PARTE 3', 540, 184); X.restore();

  // 1) GANCHO (visible desde el fotograma 0): ¿1 EMPRESA O 500?
  if (t < T.mismos + 0.3) {
    const f = 1 - prog(t, T.mismos - 0.15, 0.4);
    const k1 = lerp(0.7, 1, eback(prog(t, 0.0, 0.35), 2)), k2 = lerp(0.7, 1, eback(prog(t, 0.08, 0.35), 2));
    const g500 = 1 + 0.25 * Math.exp(-Math.max(0, t - T.q0) * 5) * (t > T.q0 ? 1 : 0), g1 = 1 + 0.18 * Math.exp(-Math.max(0, t - T.empresa0) * 5) * (t > T.empresa0 ? 1 : 0);
    X.save(); X.globalAlpha = f;
    X.save(); X.translate(540, 470); X.rotate(-0.05); X.scale(k1 * g1, k1 * g1); comic('¿1 EMPRESA', 0, 0, 132, '#ffffff'); X.restore();
    X.save(); X.translate(540, 650); X.rotate(-0.05); X.scale(k2 * g500, k2 * g500); comic('O 500?', 0, 0, 190, PAL.amb); X.restore();
    sello('PARTE 3', 885, 285, prog(t, T.parte - 0.1, 0.25), PAL.cian, 44, 10);
    X.restore();
  }
  // 2) 2013: los mismos 60 € → índice de 500 empresas (rejilla que se enciende)
  if (t > T.mismos - 0.15 && t < T.hoy + 0.3) {
    const f = 1 - prog(t, T.hoy - 0.15, 0.4), k = prog(t, T.mismos - 0.15, 0.45);
    X.save(); X.globalAlpha = f; const r = panel(540, 600, 920, 510, k, PAL.cian);
    comic('2013 · LOS MISMOS 60 €', 0, -200, 54, '#ffffff', { sombra: PAL.rosa });
    const km = eback(prog(t, T.sesenta - 0.15, 0.4), 2); moneda60(-300, 20, 1.15, Math.max(0.001, km));
    const ka = eout(prog(t, T.anio, 0.4)); X.save(); X.globalAlpha *= clamp(ka * 2); X.strokeStyle = '#ffffff'; X.lineWidth = 10; X.lineCap = 'round';
    X.beginPath(); X.moveTo(-200, 20); X.lineTo(-200 + 90 * ka, 20); X.stroke(); X.beginPath(); X.moveTo(-200 + 90 * ka, 20); X.lineTo(-200 + 90 * ka - 22, 0); X.moveTo(-200 + 90 * ka, 20); X.lineTo(-200 + 90 * ka - 22, 40); X.stroke(); X.restore();
    const n = 500 * eio(prog(t, T.indice - 0.1, Math.max(0.6, T.unidos - T.indice)));
    rejilla(150, -5, 14, n);
    const kl = prog(t, T.q1 - 0.15, 0.3); X.save(); X.globalAlpha *= clamp(kl * 2); comic('S&P 500', 150, 178, 50, PAL.verde, { sombra: null }); X.restore();
    X.save(); X.globalAlpha *= clamp(prog(t, T.unidos - 0.2, 0.3) * 2); X.font = '700 26px Inter'; X.fillStyle = 'rgba(255,255,255,.85)'; X.textAlign = 'center'; X.fillText('las 500 mayores empresas de EE. UU.', 150, 222); X.restore();
    r(); X.restore();
  }
  // 3) HOY: casi 300 € (≈ ×5)
  if (t > T.hoy - 0.15 && t < T.menos + 0.3) {
    const f = 1 - prog(t, T.menos - 0.15, 0.4), k = prog(t, T.hoy - 0.15, 0.45);
    X.save(); X.globalAlpha = f; const r = panel(540, 590, 900, 420, k, PAL.verde);
    X.font = '800 34px Inter'; X.fillStyle = '#b9f7cf'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText('ESOS 60 € HOY (20-NOV-2026)', 0, -150);
    const kc = eio(prog(t, T.hoy + 0.1, Math.max(0.6, T.tres - T.hoy - 0.1))); const v = Math.round(lerp(60, 300, kc) / 10) * 10;
    const golpe = 1 + 0.22 * Math.exp(-Math.max(0, t - T.tres) * 6) * (t > T.tres ? 1 : 0);
    const km = prog(t, T.tres - 0.35, 0.3); X.save(); X.globalAlpha *= clamp(km * 2); comic('CASI', 0, -88, 48, '#ffffff', { sombra: null }); X.restore();
    X.save(); X.scale(golpe, golpe); comic(v.toLocaleString('es-ES') + ' €', 0, 0, 150, PAL.verde, { sombra: PAL.rosa }); X.restore();
    X.font = '700 24px Inter'; X.fillStyle = 'rgba(255,255,255,.82)';
    X.fillText('S&P 500: 1.704,76 (17-sep-2013) → 6.910,39 (20-nov-2026)', 0, 104);
    X.fillText('≈ 295 € con el cambio del BCE', 0, 138);
    X.fillText('sin dividendos, comisiones ni impuestos', 0, 172);
    r(); X.restore();
    X.save(); X.globalAlpha = f; sello('≈ ×5', 905, 600, prog(t, T.cinco - 0.1, 0.25), PAL.amb, 58, 8); X.restore();
  }
  // 4) MENOS QUE TAKE-TWO… VALE: tres barras
  if (t > T.menos - 0.15 && t < T.pero + 0.3) {
    const f = 1 - prog(t, T.pero - 0.15, 0.4), k = prog(t, T.menos - 0.15, 0.4);
    X.save(); X.globalAlpha = f; const r = panel(540, 600, 900, 470, k, PAL.amb);
    comic('60 € EN 2013 → HOY', 0, -195, 50, '#ffffff', { sombra: PAL.rosa });
    const kb = eout(prog(t, T.menos, 0.7)), base = 150, maxH = 225;
    const barras = [[-260, 14, PAL.amb, 'TAKE-TWO', '≈ ×14'], [0, 4.9, PAL.verde, 'ÍNDICE 500', '≈ ×5'], [260, 0, PAL.rojo, 'THQ', '0']];
    barras.forEach(([bx, m, col, lab, val], i) => {
      const kk = eout(clamp(kb * 1.3 - i * 0.15)), h = Math.max(8, maxH * m / 14 * kk);
      X.save(); X.shadowColor = col; X.shadowBlur = 18; rr(bx - 70, base - h, 140, h, 14, col); X.restore();
      X.save(); X.globalAlpha *= clamp(kk * 2); comic(val, bx, base - h - 40, 50, col === PAL.rojo ? PAL.rojo : '#ffffff', { sombra: null }); X.restore();
      X.font = '800 28px Inter'; X.fillStyle = '#fff'; X.textAlign = 'center'; X.fillText(lab, bx, base + 40);
    });
    X.font = '700 23px Inter'; X.fillStyle = 'rgba(255,255,255,.75)'; X.fillText('Take-Two: parte 2 (19-nov) · THQ quebró en 2012', 0, 222);
    r(); X.restore();
    X.save(); X.globalAlpha = f; sello('VALE', 870, 470, prog(t, T.vale - 0.1, 0.25), PAL.cian, 50, 9); X.restore();
  }
  // 5) SI UNA QUIEBRA, NO TE QUEDAS A CERO: se apaga una luz de 500
  if (t > T.pero - 0.15 && t < T.y + 0.3) {
    const f = 1 - prog(t, T.y - 0.15, 0.4), k = prog(t, T.pero - 0.15, 0.45);
    X.save(); X.globalAlpha = f; const r = panel(540, 600, 900, 480, k, PAL.verde);
    comic('SI UNA QUIEBRA…', 0, -200, 56, '#ffffff', { sombra: PAL.rojo });
    const kr = prog(t, T.quiebra - 0.1, 1.1);
    rejilla(0, -5, 16, 500, { rota: 262, kRota: kr });
    if (kr > 0) { const c = 262 % 25, fi = Math.floor(262 / 25), px = (c - 12) * 16, py = -5 + (fi - 9.5) * 16 + eio(clamp((kr - 0.35) / 0.65)) * 90; X.save(); X.globalAlpha *= 1 - clamp((kr - 0.5) / 0.5); X.shadowColor = PAL.rojo; X.shadowBlur = 20; X.fillStyle = PAL.rojo; X.fillRect(px - 14, py - 14, 28, 28); X.strokeStyle = '#fff'; X.lineWidth = 3; X.strokeRect(px - 14, py - 14, 28, 28); X.restore(); }
    if (kr > 0.2) { X.save(); X.globalAlpha *= clamp((kr - 0.2) * 3); comic('−1', 250, 40, 56, PAL.rojo, { sombra: null }); X.restore(); }
    const kq = prog(t, T.quiebra + 0.5, 0.3); X.save(); X.globalAlpha *= clamp(kq * 2); X.font = '800 30px Inter'; X.fillStyle = '#b9f7cf'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText('quedan 499', 250, 95); X.restore();
    r(); X.restore();
    X.save(); X.globalAlpha = f; sello('NO TE QUEDAS A 0', 540, 818, prog(t, T.cero - 0.1, 0.25), PAL.amb, 46, -4); X.restore();
  }
  // 6) Y ESO, DESPUÉS DE LA PEOR SEMANA DESDE ABRIL DE 2025 (ticker rojo)
  if (t > T.y - 0.15 && t < T.cta + 0.3) {
    const f = 1 - prog(t, T.cta - 0.15, 0.4), k = prog(t, T.y - 0.15, 0.45);
    X.save(); X.globalAlpha = f; const r = panel(540, 600, 900, 470, k, PAL.rojo);
    X.font = '800 30px Inter'; X.fillStyle = '#ffd0d5'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText('WALL STREET · SEMANA DEL 16 AL 20-NOV', 0, -190);
    // gráfica que baja 5 días
    const kc = eout(prog(t, T.y + 0.1, Math.max(0.8, T.peor - T.y)));
    const pts = [[-360, -120], [-200, -95], [-40, -60], [120, -70], [280, 10], [360, 30]];
    X.save(); X.lineJoin = 'round'; X.lineCap = 'round'; X.shadowColor = PAL.rojo; X.shadowBlur = 14; X.strokeStyle = PAL.rojo; X.lineWidth = 11; X.beginPath(); X.moveTo(...pts[0]);
    const nn = kc * (pts.length - 1); for (let i = 1; i < pts.length; i++) { const ff = clamp(nn - (i - 1)); if (ff <= 0) break; X.lineTo(lerp(pts[i - 1][0], pts[i][0], ff), lerp(pts[i - 1][1], pts[i][1], ff)); } X.stroke(); X.restore();
    const kp = eback(prog(t, T.peor - 0.15, 0.35), 2); X.save(); X.globalAlpha *= clamp(kp * 2); X.translate(0, 90); X.scale(kp, kp); comic('S&P 500  −8,6 %', 0, 0, 92, PAL.rojo, { sombra: PAL.tinta }); X.restore();
    X.save(); X.globalAlpha *= clamp(prog(t, T.anio25 - 0.3, 0.3) * 2); X.font = '800 32px Inter'; X.fillStyle = '#fff'; X.fillText('la peor semana desde abril de 2025', 0, 172); X.restore();
    r(); X.restore();
    X.save(); X.globalAlpha = f * clamp(prog(t, T.anio25 + 0.2, 0.3) * 2); sello('Y AUN ASÍ ≈ ×5', 540, 1030, prog(t, T.anio25 + 0.2, 0.25), PAL.verde, 44, -3); X.restore();
  }
  // 7) CTA: pregunta de dos opciones + SEGUIR
  if (t > T.cta - 0.1) {
    const k0 = eback(prog(t, T.cta - 0.1, 0.4), 2);
    X.save(); X.translate(540, 430); X.rotate(-0.04); X.scale(k0, k0); comic('¿TÚ QUÉ', 0, -50, 92, '#ffffff', { sombra: PAL.cian }); comic('ELIGES?', 0, 50, 104, PAL.amb); X.restore();
    const b1 = eback(prog(t, T.una - 0.15, 0.4)), b2 = eback(prog(t, T.q6 - 0.15, 0.4));
    const boton = (k, y, col, txt, icono) => { if (k <= 0) return; X.save(); X.globalAlpha = clamp(k * 2); X.translate(540, y + (1 - k) * 60); X.scale(0.7 + 0.3 * k, 0.7 + 0.3 * k); X.rotate(-0.025);
      rr(-400, -66, 800, 132, 66, col); X.strokeStyle = PAL.tinta; X.lineWidth = 7; X.stroke(); icono();
      X.font = 'italic 900 50px Inter'; X.fillStyle = PAL.tinta; X.textAlign = 'left'; X.textBaseline = 'middle'; X.fillText(txt, -190, 4); X.restore(); };
    boton(b1, 610, PAL.amb, '1 · UNA EMPRESA', () => { X.fillStyle = '#fff6d6'; X.beginPath(); X.arc(-280, 0, 40, 0, 7); X.fill(); X.strokeStyle = PAL.tinta; X.lineWidth = 6; X.stroke(); comic('€', -280, 3, 46, PAL.tinta, { stroke: '#fff6d6', sw: 0.05, sombra: null, ital: false }); });
    boton(b2, 770, PAL.verde, '2 · 500 EMPRESAS', () => { X.fillStyle = PAL.tinta; for (let i = 0; i < 25; i++) X.fillRect(-312 + (i % 5) * 14, -32 + Math.floor(i / 5) * 14, 10, 10); });
    const k3 = eout(prog(t, T.q6 + 0.5, 0.4));
    X.save(); X.globalAlpha = clamp(k3 * 2); rr(540 - 180, 870 - 38 + (1 - k3) * 30, 360, 76, 38, '#ffffff'); X.font = 'italic 900 38px Inter'; X.fillStyle = PAL.tinta; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText('Comenta 1 o 2', 540, 872 + (1 - k3) * 30); X.restore();
    // botón SEGUIR con la promesa de la parte 4 (últimos ~1,6 s)
    const ks = eback(prog(t, T.fin - 0.1, 0.35), 2), pulso = 1 + 0.05 * Math.sin(Math.max(0, t - T.fin) * 9);
    if (ks > 0) { X.save(); X.globalAlpha = clamp(ks * 2); X.translate(540, 1010); X.scale(ks * pulso, ks * pulso); rr(-250, -44, 500, 88, 44, PAL.rosa); X.strokeStyle = '#fff'; X.lineWidth = 5; X.stroke();
      X.font = 'italic 900 40px Inter'; X.fillStyle = '#fff'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText('+ SEGUIR · ¿PARTE 4?', 0, 3); X.restore(); }
  }
  if (t < T.cta - 0.1) subtitulos(t);
  // aviso (pequeño) y marca
  X.save(); X.globalAlpha = 0.88; X.font = '600 23px Inter'; X.fillStyle = '#f1e4ff'; X.textAlign = 'center'; X.textBaseline = 'middle';
  if (t > T.hoy - 0.2 && t < T.cta - 0.1) { X.fillText('Rentabilidades pasadas no garantizan rentabilidades futuras.', 540, 1545); X.fillText('Contenido educativo, no es una recomendación de inversión.', 540, 1577); }
  else X.fillText('@eleurolisto', 540, 1545);
  X.restore();
}

// ---------- Listo: accesorios y animaciones según la historia ----------
function listoEnCoche(t) {
  if (window.PORTADA) return null;
  let expr = 'sorpresa', pose = 'saludo', acc = ['gafas', 'mando'], modo = null, accK = {}, anim = null, animT = 0, mira = [0.6, -0.3];
  if (t > T.q0 - 0.1 && t < T.mismos) { pose = 'brazosAbiertos'; expr = 'feliz'; anim = 'salto'; animT = t - (T.q0 - 0.1); }
  if (t >= T.mismos && t < T.hoy) { expr = 'habla'; pose = 'senala'; acc = ['gafas']; }
  if (t >= T.hoy && t < T.menos) { // celebra: gafas + cadena que cae en "300 €"
    acc = ['gafas', 'cadena']; expr = 'feliz'; pose = 'celebra'; accK = { cadena: prog(t, T.tres - 0.25, 0.45) };
    if (t > T.tres - 0.1) { anim = 'salto'; animT = t - (T.tres - 0.1); if (animT > 2) anim = null; }
  }
  if (t >= T.menos && t < T.pero) { acc = ['gafas']; anim = 'mirarAtras'; animT = t - T.menos; mira = [-0.8, -0.3]; pose = 'brazosCruzados'; expr = 'normal'; }
  if (t >= T.pero && t < T.y) {
    acc = []; expr = t < T.cero - 0.1 ? 'preocupado' : 'idea'; pose = t < T.cero - 0.1 ? 'piensa' : 'manosCadera';
    if (t > T.quiebra - 0.1 && t < T.cero - 0.1) { anim = 'temblor'; animT = t - (T.quiebra - 0.1); }
  }
  if (t >= T.y && t < T.cta) { acc = []; expr = 'preocupado'; pose = 'brazosCruzados'; if (t < T.anio25 + 0.2) { anim = 'temblor'; animT = t - T.y; } else { expr = 'guino'; pose = 'manosCadera'; acc = ['gafas']; accK = { gafas: prog(t, T.anio25 + 0.2, 0.4) }; } }
  if (t >= T.cta) { acc = ['gafas', 'mando']; accK = { mando: prog(t, T.una - 0.2, 0.4) }; expr = 'guino'; pose = 'pulgar'; anim = 'rebote'; animT = t - T.cta; }
  return () => Listo2D.dibujar(X, { x: -50, y: 30, s: 0.84, t, expr, pose, estilo: 'tropical', glow: 1.25, mira, acc, modo, accK, anim, animT, fijarPose: !!(anim === 'rebote') });
}

window.renderAt = (t) => {
  X.setTransform(1, 0, 0, 1, 0, 0);
  const golpe = (a) => Math.exp(-Math.max(0, t - a) * 5) * (t > a ? 1 : 0);
  const punch = 1 + 0.025 * (golpe(T.q0) + golpe(T.tres) + golpe(T.quiebra) + golpe(T.peor));
  const zoomFin = 1 + 0.04 * eio(prog(t, T.cta - 0.2, 1.2));
  const z = punch * zoomFin;
  X.setTransform(z, 0, 0, z, 540 - 540 * z, 1280 - 1280 * z);
  cielo(); luna(); skyline(t); mar(t); playa(t);
  const cx = lerp(-200, 520, eout(prog(t, 0, 0.9))) + Math.sin(t * 0.8) * 10;
  carretera(t);
  coche(t, cx, 1395, listoEnCoche(t));
  X.setTransform(1, 0, 0, 1, 0, 0);
  const v = X.createRadialGradient(540, 960, 600, 540, 960, 1300); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(5,0,14,.5)'); X.fillStyle = v; X.fillRect(0, 0, 1080, 1920);
  if (window.PORTADA) { Listo2D.dibujar(X, { x: 860, y: 1500, s: 1.2, t: 2, expr: 'sorpresa', pose: 'brazosAbiertos', estilo: 'tropical', glow: 1.25, acc: ['gafas', 'mando'], mira: [-0.6, -0.4] }); return; }
  capa(t);
};
