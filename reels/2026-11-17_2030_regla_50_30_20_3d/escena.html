const salidasHook = (x) => (x < 0 ? 0 : Math.min(NTOT, Math.floor(x / 0.039) + 1));

// ---------- iconos 3D (necesidades / caprichos) ----------
const icono = (fn) => { const g = new THREE.Group(); fn(g); g.visible = false; esc.add(g); return g; };
const icoCasa = icono((g) => { g.add(caja(0.16, 0.12, 0.12, 0xf3efe6, [0, 0.06, 0])); g.add(malla(new THREE.ConeGeometry(0.14, 0.1, 4), 0xd2452f, [0, 0.17, 0]).rotateY(Math.PI / 4)); g.add(caja(0.04, 0.07, 0.01, 0x7a4b2a, [0, 0.035, 0.062])); });
const icoBolsa = icono((g) => { g.add(caja(0.14, 0.16, 0.08, 0xd9a35b, [0, 0.08, 0])); g.add(malla(new THREE.TorusGeometry(0.035, 0.008, 6, 12, Math.PI), 0x8a5a2a, [0, 0.16, 0])); g.add(bola(0.03, 0x4caf50, [-0.03, 0.17, 0], 0)); g.add(cil(0.012, 0.012, 0.08, 0xf5d142, [0.035, 0.19, 0], 6)); });
const icoBombilla = icono((g) => { g.add(bola(0.07, 0xffe58a, [0, 0.12, 0], 2, { emissive: 0xffd54a, emissiveIntensity: 0.6 })); g.add(cil(0.035, 0.035, 0.05, 0x9aa3ad, [0, 0.04, 0], 10)); });
const icoRegalo = icono((g) => { g.add(caja(0.15, 0.13, 0.15, 0xe0412f, [0, 0.065, 0])); g.add(caja(0.03, 0.135, 0.155, 0xffd34d, [0, 0.065, 0])); g.add(caja(0.155, 0.135, 0.03, 0xffd34d, [0, 0.065, 0])); g.add(bola(0.03, 0xffd34d, [0, 0.14, 0], 0)); });
const icoPizza = icono((g) => { const s = new THREE.Shape(); s.moveTo(0, 0.18); s.lineTo(-0.09, -0.02); s.lineTo(0.09, -0.02); s.lineTo(0, 0.18); const m = malla(new THREE.ExtrudeGeometry(s, { depth: 0.025, bevelEnabled: false }), 0xf2c14e); g.add(m); g.add(caja(0.2, 0.035, 0.03, 0xc98a3a, [0, -0.025, 0.012])); for (const [x, y] of [[0, 0.09], [-0.03, 0.02], [0.035, 0.03]]) g.add(cil(0.02, 0.02, 0.01, 0xc0392b, [x, y, 0.03], 10).rotateX(Math.PI / 2)); });
const icons = [
  { g: icoCasa, j: 0, t0: tIcon0[0], dx: -0.14 }, { g: icoBolsa, j: 0, t0: tIcon0[1], dx: 0 }, { g: icoBombilla, j: 0, t0: tIcon0[2], dx: 0.14 },
  { g: icoRegalo, j: 1, t0: tIcon1[0], dx: -0.09 }, { g: icoPizza, j: 1, t0: tIcon1[1], dx: 0.09 },
];
icons.forEach((ic) => (ic.t1 = ic.j === 0 ? st(3) - 0.15 : st(4) - 0.15));

// ---------- huchas de los 12 meses ----------
const mini = [];
for (let i = 0; i < 12; i++) {
  const g = new THREE.Group(); g.position.set(EX[i % 6], EY[Math.floor(i / 6)] + 0.02, EZ + 0.01); esc.add(g);
  const v = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.2, 20, 1, true), vidrio); v.position.y = 0.1; v.renderOrder = 2; g.add(v);
  for (let k = 0; k < 5; k++) { const b = malla(new THREE.BoxGeometry(0.1, 0.012, 0.05), 0xf0a54e, [0, 0.01 + k * 0.014, 0]); b.rotation.y = (hash(i * 5 + k) - 0.5) * 1.5; g.add(b); }
  g.add(cil(0.082, 0.082, 0.03, 0x22c55e, [0, 0.215, 0], 20));
  g.scale.setScalar(0.001); mini.push(g);
}

// ---------- personaje ----------
const yo = L.persona({ chaqueta: 0x2f8f6a, pantalon: 0x2e3a55, pelo: 0x2a1a10 });
yo.root.position.set(1.05, 0, -0.78); yo.root.rotation.y = -0.15; esc.add(yo.root);

// ---------- luces ----------
const hemi = new THREE.HemisphereLight(0xbfd0ff, 0x4a3426, 1.1); esc.add(hemi);
const key = new THREE.DirectionalLight(0xffe2b8, 2.2); key.position.set(1.5, 5, 3); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 15 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.radius = 3; key.target.position.set(0, 0.8, -0.5); esc.add(key, key.target);
const fill = new THREE.DirectionalLight(0x9fb4ff, 0.6); fill.position.set(-3, 3, 4); esc.add(fill);
esc.add(new THREE.AmbientLight(0xffe6c8, 0.28));
const verde = new THREE.PointLight(0x22c55e, 0, 2.2, 2); esc.add(verde);

// ---------- cámara ----------
const T = [st(1), st(2), st(3), st(4), st(5), st(6), st(7)];
const camara = L.camaraSuave([
  { t: 0, p: [0.85, 1.8, 3.05], m: [0.78, 1.45, -0.45], fov: 50 },
  { t: tCero, p: [0.88, 1.72, 2.6], m: [0.8, 1.45, -0.45], fov: 49 },
  { t: tRw0 + 0.2, p: [0.86, 1.75, 2.75], m: [0.8, 1.45, -0.45], fov: 50 },
  { t: tJar[0] + 0.1, p: [-0.05, 2.0, 3.75], m: [-0.05, 1.42, -0.2], fov: 50 },
  { t: T[1] - 0.1, p: [-0.1, 1.98, 3.6], m: [-0.1, 1.42, -0.2], fov: 50 },
  { t: tF[0] + 0.8, p: [-0.2, 1.92, 3.25], m: [-0.19, 1.43, -0.1], fov: 50 },
  { t: T[2] - 0.2, p: [-0.2, 1.9, 3.18], m: [-0.19, 1.43, -0.1], fov: 50 },
  { t: tF[1] + 0.6, p: [-0.18, 1.9, 3.2], m: [-0.18, 1.43, -0.1], fov: 50 },
  { t: T[3] - 0.2, p: [-0.17, 1.9, 3.15], m: [-0.18, 1.43, -0.1], fov: 50 },
  { t: tF[2] + 0.6, p: [-0.16, 1.88, 3.15], m: [-0.17, 1.42, -0.1], fov: 50 },
  { t: tCandado + 0.3, p: [-0.15, 1.85, 3.1], m: [-0.16, 1.42, -0.1], fov: 50 },
  { t: T[4] + 0.55, p: [0.0, 2.42, 0.95], m: [0.0, 1.82, -2.2], fov: 50 },
  { t: T[5] - 0.25, p: [0.05, 2.4, 0.85], m: [0.0, 1.82, -2.2], fov: 50 },
  { t: T[5] + 0.65, p: [-0.18, 1.95, 3.35], m: [-0.18, 1.43, -0.15], fov: 50 },
  { t: T[6] - 0.1, p: [-0.12, 1.92, 3.25], m: [-0.14, 1.43, -0.15], fov: 50 },
  { t: DUR, p: [0.15, 2.2, 4.4], m: [0.1, 1.38, -0.4], fov: 52 },
], 0.3);

// ---------- capas 2D ----------
const $ = (id) => document.getElementById(id);
const subs = L.subtitulos($("subs"), TIM, {
  clave: ["1.400", "cero", "regla", "50", "700", "30", "420", "20", "280", "ahorro", "3.360", "60", "toca", "nómina"],
});
const barra = $("barra"); barra.innerHTML = S.map(() => "<i><b></b></i>").join("");
const fmt = L.fmtEur;
const jl = [0, 1, 2].map((j) => $("jl" + j));

window.renderAt = (t) => {
  const tu = tau(t);
  // ---- billetes ----
  let enPila = 0;
  for (const b of bills) {
    const g = b.g; g.visible = true; g.scale.setScalar(1);
    const pp = pilaPos(b.p), pr = pilaRot(b.p);
    if (tu >= 0) { // gancho o rebobinado
      const k = (tu - b.tHook) / HOOK_V;
      if (k < 0) { g.position.copy(pp); g.rotation.set(0, pr, 0); enPila++; }
      else if (k < 1) vuela(g, pp, hookDest(b.d), pr, pr + 3, k, 0.6, 1 + (b.d % 3));
      else g.visible = false;
      continue;
    }
    if (t < b.tSal) { g.position.copy(pp); g.rotation.set(0, pr, 0); enPila++; continue; }
    const ja = jarPos(b.j, b.s), ra = jarRot(b.j, b.s);
    if (t < b.tLleg) { vuela(g, pp, ja, pr, ra, (t - b.tSal) / VUELO, 0.55, 1); continue; }
    if (b.tTr === undefined || t < b.tTr) { g.position.copy(ja); g.rotation.set(0, ra, 0); continue; }
    const jb = jarPos(0, b.s2), rb = jarRot(0, b.s2), k = (t - b.tTr) / 0.5;
    if (k < 1) vuela(g, ja, jb, ra, rb, k, 0.45, 2); else { g.position.copy(jb); g.rotation.set(0, rb, 0); }
  }
  const cuenta = tu >= 0 ? 20 * enPila : null;
  // importe de cada tarro (billetes ya dentro)
  const amt = [0, 0, 0];
  for (const b of bills) {
    if (tu >= 0) continue;
    if (t >= b.tLleg) { if (b.tTr !== undefined && t >= b.tTr + 0.5) amt[0] += 20; else if (b.tTr !== undefined && t >= b.tTr) {} else amt[b.j] += 20; }
  }
  // ---- tarros ----
  tarros.forEach((J, j) => {
    const k = prog(t, tJar[j], 0.45);
    J.g.visible = k > 0;
    J.g.scale.setScalar(Math.max(0.001, easeBack(k, 2.4)));
    let pulso = 0;
    for (let i = 0; i < 3; i++) if (j === i) pulso = Math.exp(-Math.max(0, t - (tF[j] + NB[j] * DT[j] + VUELO)) * 3) * (t > tF[j] + NB[j] * DT[j] + VUELO ? 1 : 0);
    J.luz.intensity = 2.5 * pulso;
  });
  // tapa y candado (ahorro)
  const J3 = tarros[2], top3 = IY + JH + 0.05;
  const kt = prog(t, tTapa, 0.32);
  tapa.visible = kt > 0;
  const caida = kt < 1 ? lerp(0.9, 0, easeIn(kt)) : Math.abs(Math.sin((t - tTapa - 0.32) * 18)) * 0.03 * Math.exp(-(t - tTapa - 0.32) * 8);
  tapa.position.set(JX[2], top3 + caida, JZ); tapa.rotation.set(0, 0, kt < 1 ? (1 - kt) * 0.5 : 0);
  const kc = prog(t, tCandado, 0.35);
  candado.visible = kc > 0;
  candado.scale.setScalar(Math.max(0.001, easeBack(kc, 2.5)));
  const meneo = t > tNo - 0.1 && t < tToca + 0.5 ? Math.sin((t - tNo) * 30) * 0.18 * Math.exp(-Math.max(0, t - tNo) * 2) : 0;
  candado.position.set(JX[2], IY + JH - 0.06, JZ + JR + 0.035); candado.rotation.set(0, 0, meneo);
  const brilloV = Math.max(0.6 * smooth(prog(t, tCandado, 0.4)) * (t < st(5) ? 1 : 0), (t > tNo - 0.2 && t < tCTA) ? 1.2 * smooth(prog(t, tNo - 0.2, 0.3)) * (0.75 + 0.25 * Math.sin(t * 9)) : 0);
  verde.position.set(JX[2], IY + 0.5, JZ + 0.45); verde.intensity = 3 * brilloV;
  // ---- iconos ----
  for (const ic of icons) {
    const k = prog(t, ic.t0, 0.35), ko = prog(t, ic.t1, 0.35);
    ic.g.visible = k > 0 && ko < 1;
    if (!ic.g.visible) continue;
    const s = easeBack(k, 2.2) * (1 - easeIn(ko));
    ic.g.scale.setScalar(Math.max(0.001, s * 0.95));
    ic.g.position.set(JX[ic.j] + ic.dx * 0.9, IY + 0.002 + 0.05 * Math.max(0, Math.sin(Math.PI * clamp(k * 1.4))), JZ + 0.33);
    ic.g.rotation.set(0, Math.sin(t * 1.6 + ic.dx * 5) * 0.4, 0);
  }
  // ---- 12 meses ----
  mini.forEach((g, i) => { const k = prog(t, tMes(i), 0.3); g.scale.setScalar(Math.max(0.001, easeBack(k, 2.6))); g.visible = k > 0; });
  // ---- lámparas ----
  lamps.forEach((g, i) => { g.rotation.z = Math.sin(t * 1.2 + i) * 0.03; });
  // ---- personaje ----
  const p = yo; p.root.position.y = 0;
  p.torso.scale.y = 1 + 0.012 * Math.sin((t / 3.1) * Math.PI * 2);
  let aX = 0.05 * Math.sin(t * 2), aZ = 0.06, aXd = null;
  let objetivo = v3([0.8, 1.2, 1.5]);
  let susto = 0, sonrisa = 0;
  if (tu >= 0) {
    const kh = clamp(tu / 3.0);
    aX = lerp(aX, -2.5, smooth(prog(tu, 1.6, 1.2))); aZ = lerp(0.06, 0.6, smooth(prog(tu, 1.6, 1.2)));
    susto = smooth(prog(tu, 0.3, 1.0));
    const vol = bills.find((b) => tu > b.tHook && tu < b.tHook + HOOK_V * 0.6);
    objetivo = vol ? vol.g.getWorldPosition(new THREE.Vector3()) : v3([PX, 1.2, PZ]);
  } else {
    let jAct = t < tF[1] - 0.3 ? 0 : t < tF[2] - 0.3 ? 1 : 2;
    objetivo = v3([JX[jAct], 1.3, JZ]);
    if (t < tF[0] - 0.4) objetivo = v3([0, 1.2, 1.8]);
    if (t > st(5) - 0.1 && t < st(6)) objetivo = v3([0, 1.8, -2.1]);
    if (t >= st(6)) objetivo = v3([JX[0], 1.25, JZ]);
    if (t >= tNo - 0.6) objetivo = v3([JX[2], 1.3, JZ]);
    if (t >= tCTA) objetivo = v3([0.3, 1.6, 4]);
    sonrisa = smooth(prog(t, tCandado, 0.4)) * (1 - prog(t, tNo - 0.7, 0.3)) + smooth(prog(t, tCTA, 0.4));
    // intenta coger del tarro de ahorro... y no
    const kr = smooth(prog(t, tNo - 0.65, 0.4)) * (1 - smooth(prog(t, tNo + 0.05, 0.35)));
    aXd = lerp(aX, -1.25, kr);
    p.root.rotation.y = lerp(-0.15, -0.55, kr);
    susto = 0.6 * Math.sin(Math.PI * prog(t, tNo - 0.05, 0.6));
  }
  p.brazoI.rotation.set(aX, 0, aZ); p.brazoD.rotation.set(aXd ?? aX, 0, -aZ);
  if (tu >= 0) p.root.rotation.y = -0.15;
  L.mirarA(p, objetivo, 1);
  if (t > tNo && t < tToca + 0.3) p.cabeza.rotation.y += Math.sin((t - tNo) * 16) * 0.35 * (1 - prog(t, tNo, 0.9));
  p.boca.scale.set(1 - 0.3 * susto + 0.7 * sonrisa, 1 + 2.6 * susto - 0.2 * sonrisa, 1);
  p.cejas.forEach((c) => (c.position.y = 0.335 + 0.035 * susto));
  // ---- cámara ----
  const c = camara(t);
  const sh = (x0) => Math.exp(-Math.max(0, t - x0) * 7) * (t > x0 ? 1 : 0) * 0.035;
  const s = sh(tCero) + sh(tTapa + 0.32) + sh(tNo);
  cam.position.set(c.p[0] + Math.sin(t * 0.7) * 0.02 + Math.sin(t * 61) * s, c.p[1] + Math.sin(t * 0.53) * 0.015 + Math.cos(t * 53) * s, c.p[2]);
  cam.lookAt(...c.m); cam.fov = c.fov; cam.updateProjectionMatrix();
  r.render(esc, cam);

  // ----- 2D -----
  subs(t);
  [...barra.children].forEach((el, i) => { const a = i === 0 ? 0 : st(i), b = i < S.length - 1 ? st(i + 1) : DUR; el.firstChild.style.width = 100 * clamp((t - a) / (b - a)) + "%"; });
  $("label").textContent = t < tTit ? "SIMULACIÓN · NÓMINA 1.400 €" : "REGLA 50/30/20 · NÓMINA 1.400 €";
  // panel del gancho
  const panel = $("panel"), kp = tu >= 0 ? 1 : 1 - prog(t, tRw1, 0.3);
  panel.style.opacity = kp; panel.style.transform = `translateX(${(1 - kp) * -60}px)`;
  if (tu >= 0) {
    const dia = Math.min(20, 1 + Math.floor(19 * smooth(clamp(tu / (tCero + 0.05)))));
    $("dia").textContent = dia;
    $("cuenta").textContent = fmt(cuenta);
    const roj = clamp(1 - cuenta / 1400);
    $("cuenta").style.color = `rgb(255,${Math.round(lerp(255, 90, roj))},${Math.round(lerp(255, 80, roj))})`;
  }
  const kr = t > tRw0 && t < tRw1 + 0.15 ? Math.min(prog(t, tRw0, 0.12), 1 - prog(t, tRw1, 0.15)) : 0;
  $("rew").style.opacity = kr;
  // título
  const kti = easeBack(prog(t, tTit, 0.4), 2), kto = prog(t, st(2) - 0.1, 0.3);
  $("titulo").style.opacity = kti > 0 ? 1 - kto : 0;
  $("titulo").firstChild.style.transform = `scale(${Math.max(0, kti) * (1 - 0.3 * kto)}) rotate(-3deg)`;
  // etiquetas de los tarros
  const pct = t < tHaz ? [50, 30, 20] : [t < tHaz + 0.05 ? 50 : 60, t < pal(6, "60/20") + 0.4 ? 30 : 20, 20];
  const enAnyo = t > st(5) - 0.15 && t < st(6) + 0.3;
  const fueraCTA = 1 - prog(t, tCTA - 0.1, 0.3);
  jl.forEach((el, j) => {
    const k = easeBack(prog(t, tJar[j] + 0.15, 0.4), 2);
    const top = new THREE.Vector3(JX[j], IY + JH + (j === 2 && t > tTapa ? 0.12 : 0.04), JZ).project(cam);
    el.style.left = (top.x * 0.5 + 0.5) * W + "px"; el.style.top = (-top.y * 0.5 + 0.5) * H - 10 + "px";
    const vis = k > 0 && !enAnyo ? 1 : 0;
    el.style.opacity = vis * clamp(k * 2) * fueraCTA;
    el.style.transform = `translate(-50%,-100%) scale(${0.6 + 0.4 * clamp(k)})`;
    el.querySelector(".pct").textContent = pct[j] + " %";
    el.querySelector(".amt").textContent = fmt(amt[j]);
    const llena = j === 0 && amt[0] >= 700 && t < tHaz ? 1 : 0;
    el.querySelector(".amt").style.color = j === 2 && amt[2] > 0 ? "#4ade80" : "#fff";
  });
  // 12 meses
  let meses = 0; for (let i = 0; i < 12; i++) if (t >= tMes(i) + 0.05) meses++;
  const ka = t > st(5) - 0.1 && t < st(6) + 0.2 ? Math.min(easeOut(prog(t, st(5), 0.35)), 1 - prog(t, st(6), 0.25)) : 0;
  $("anyo").style.opacity = ka; $("anyo").style.transform = `translate(-50%,${(1 - ka) * 40}px)`;
  $("anyolab").textContent = `${Math.max(1, meses)} ${meses === 1 ? "MES" : "MESES"} × 280 €`;
  $("anyoval").textContent = fmt(280 * Math.max(1, meses));
  $("anyoval").style.transform = `scale(${1 + 0.12 * Math.exp(-Math.max(0, t - tAnyoFin) * 5) * (t > tAnyoFin ? 1 : 0)})`;
  // sello "no se toca"
  const ks = prog(t, tNo, 0.22), sello = $("sello");
  sello.style.opacity = (ks > 0 ? 1 : 0) * (1 - prog(t, tCTA - 0.15, 0.25));
  sello.firstChild.style.transform = `rotate(-6deg) scale(${lerp(2.2, 1, easeOut(ks))})`;
  $("marca").style.opacity = (1 - prog(t, tCTA - 0.2, 0.3)) * (1 - (t > tTit - 0.1 && t < st(2) + 0.2 ? 1 : 0)) * (1 - (t > tNo - 0.1 && t < tCTA ? 1 : 0));
  const kc2 = prog(t, tCTA, 0.45), cta = $("cta");
  cta.style.opacity = kc2 > 0 ? 1 : 0;
  [...cta.children].forEach((el, i) => { const k = easeBack(prog(t, tCTA + i * 0.18, 0.4), 1.8); el.style.transform = `translateY(${(1 - k) * 80}px) scale(${0.6 + 0.4 * k})`; el.style.opacity = clamp(k * 2); });
};
window.listo = true;
</script></body></html>
