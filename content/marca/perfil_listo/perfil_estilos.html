<!doctype html>
<html><head><meta charset="utf-8">
<script src="../../../toolkit/mascota/listo2d.js"></script>
<style>html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#000}canvas{position:absolute;inset:0}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script>
// 5 fotos de perfil 2D de LISTO en distintos estilos de edición (renderAt(i), i = 0..4). 1080x1080, para el recorte circular.
const X = document.getElementById('c').getContext('2d');
function radial(c0, c1, cx = 540, cy = 500, r = 760) { const g = X.createRadialGradient(cx, cy, 30, cx, cy, r); g.addColorStop(0, c0); g.addColorStop(1, c1); X.fillStyle = g; X.fillRect(0, 0, 1080, 1080); }
function halo(col, a = 0.38, cy = 440) { const h = X.createRadialGradient(540, cy, 30, 540, cy, 520); h.addColorStop(0, `rgba(${col},${a})`); h.addColorStop(1, `rgba(${col},0)`); X.fillStyle = h; X.fillRect(0, 0, 1080, 1080); }
function anillo(col, w = 10) { X.strokeStyle = col; X.lineWidth = w; X.beginPath(); X.arc(540, 540, 500, 0, 7); X.stroke(); }
const V = [
  () => { // 1 · clásico (vector, la marca)
    radial('#0f2a3a', '#0b1328'); halo('34,197,94'); anillo('rgba(74,222,128,.25)');
    Listo2D.dibujar(X, { x: 540, y: 1045, s: 2.85, t: 0.4, expr: 'guino', pose: 'pulgar', mira: [0.2, -0.1], glow: 1.15 });
  },
  () => { // 2 · neón (terminal / noche)
    X.fillStyle = '#04070c'; X.fillRect(0, 0, 1080, 1080); halo('34,197,94', 0.22);
    X.globalAlpha = 0.12; X.strokeStyle = '#22c55e'; X.lineWidth = 2; for (let x = 0; x <= 1080; x += 60) { X.beginPath(); X.moveTo(x, 0); X.lineTo(x, 1080); X.stroke(); } for (let y = 0; y <= 1080; y += 60) { X.beginPath(); X.moveTo(0, y); X.lineTo(1080, y); X.stroke(); } X.globalAlpha = 1;
    X.save(); X.shadowColor = '#4ade80'; X.shadowBlur = 30; anillo('#4ade80', 8); X.restore();
    Listo2D.dibujar(X, { x: 540, y: 1045, s: 2.85, t: 0.4, expr: 'feliz', pose: 'saludo', estilo: 'neon', glow: 1.2 });
  },
  () => { // 3 · pixel art (R6)
    X.fillStyle = '#2b1d5c'; X.fillRect(0, 0, 1080, 1080);
    X.fillStyle = '#3a2873'; for (let y = 0; y < 1080; y += 60) for (let x = (y / 60) % 2 ? -60 : 0; x < 1080; x += 120) X.fillRect(x + 4, y + 4, 112, 52);
    X.fillStyle = 'rgba(0,0,0,.18)'; for (let y = 0; y < 1080; y += 6) X.fillRect(0, y, 1080, 2);
    halo('74,222,128', 0.25);
    X.imageSmoothingEnabled = false;
    Listo2D.pixel(X, { x: 540, y: 1060, s: 2.75, px: 9, t: 0.4, expr: 'sorpresa', pose: 'saludo' });
  },
  () => { // 4 · neón tropical (atardecer, R8)
    const g = X.createLinearGradient(0, 0, 0, 1080); g.addColorStop(0, '#2a0b4a'); g.addColorStop(0.55, '#c4307a'); g.addColorStop(0.85, '#ff7a4d'); g.addColorStop(1, '#ffb45e'); X.fillStyle = g; X.fillRect(0, 0, 1080, 1080);
    const sg = X.createLinearGradient(0, 640, 0, 1080); sg.addColorStop(0, '#fff4b8'); sg.addColorStop(1, '#ff6a5a'); X.fillStyle = sg; X.beginPath(); X.arc(540, 900, 330, 0, 7); X.fill();
    X.fillStyle = '#2a0d3a'; for (const [x, h, s] of [[90, 620, -1], [990, 560, 1]]) { X.save(); X.translate(x, 1080); X.lineWidth = 26; X.strokeStyle = '#2a0d3a'; X.beginPath(); X.moveTo(0, 0); X.quadraticCurveTo(s * 30, -h * 0.5, s * 60, -h); X.stroke(); X.translate(s * 60, -h); for (let k = 0; k < 7; k++) { X.save(); X.rotate(-Math.PI / 2 + (k - 3) * 0.52); X.beginPath(); X.moveTo(0, -8); X.quadraticCurveTo(100, -36, 200, 14); X.quadraticCurveTo(100, 6, 0, 8); X.fill(); X.restore(); } X.restore(); }
    Listo2D.dibujar(X, { x: 540, y: 1045, s: 2.85, t: 0.4, expr: 'guino', pose: 'pulgar', estilo: 'tropical', mira: [0.2, -0.1] });
  },
  () => { // 5 · dibujado a mano (libreta)
    X.fillStyle = '#fbf7ee'; X.fillRect(0, 0, 1080, 1080);
    X.strokeStyle = 'rgba(59,130,246,.22)'; X.lineWidth = 3; for (let y = 80; y < 1080; y += 64) { X.beginPath(); X.moveTo(0, y); X.lineTo(1080, y); X.stroke(); }
    X.strokeStyle = 'rgba(239,68,68,.35)'; X.beginPath(); X.moveTo(120, 0); X.lineTo(120, 1080); X.stroke();
    X.strokeStyle = 'rgba(34,197,94,.55)'; X.lineWidth = 16; X.lineCap = 'round'; X.beginPath(); X.ellipse(540, 545, 470, 480, 0.05, 0.2, 6.1); X.stroke();
    Listo2D.dibujar(X, { x: 540, y: 1045, s: 2.85, t: 0.4, expr: 'feliz', pose: 'saludo', estilo: 'boceto' });
  },
];
window.DURACION = 5;
window.renderAt = (t) => { X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.imageSmoothingEnabled = true; V[Math.round(t)](); };
document.fonts.ready.then(() => { window.listo = true; });
</script></body></html>
